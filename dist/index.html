<title>Frontline USA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: a drafting-table war room. Blueprint sea with a survey grid, nations as flat colour plates,
   a thin instrument bar on top, a sheet of orders at the bottom, and tabs that read like drawer labels. */
:root {
  --bg: #E8EEF5; --paper: #F5F8FC; --paper2: #DCE6F1; --ink: #0E2747; --ink2: #546A88;
  --line: #B3C4D9; --grid: #CBD8E8; --sea: #D6E2F0; --stroke: #E8EEF5;
  --warn: #C8371B; --good: #13804F; --hot: #A85A00; --sel: #0E2747; --badge-ink: #0A1C30;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07182B; --paper: #0D2440; --paper2: #12304F; --ink: #E6F0FB; --ink2: #8CA6C4;
    --line: #26486D; --grid: #10304F; --sea: #091E36; --stroke: #091E36;
    --warn: #FF7455; --good: #46D69B; --hot: #FFB547; --sel: #FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07182B; --paper: #0D2440; --paper2: #12304F; --ink: #E6F0FB; --ink2: #8CA6C4;
  --line: #26486D; --grid: #10304F; --sea: #091E36; --stroke: #091E36;
  --warn: #FF7455; --good: #46D69B; --hot: #FFB547; --sel: #FFFFFF; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.35 var(--body); overflow: hidden; }
button { font: inherit; color: inherit; }
b, strong { font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; }
#top, #res { padding-left: var(--gl); padding-right: var(--gr); }
#top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 6px; border-bottom: 1px solid var(--line); background: var(--paper); }
.who { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
.who b { font: 800 21px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; flex: none; }
.who i { width: 10px; height: 10px; border: 1px solid var(--ink); align-self: center; flex: none; }
#clock { color: var(--ink2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.speed { display: flex; border: 1px solid var(--line); flex: none; }
.speed button { background: none; border: 0; border-right: 1px solid var(--line); padding: 5px 9px; min-width: 36px; min-height: 32px; font: 600 12px var(--mono); cursor: pointer; }
.speed button:last-child { border-right: 0; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#res { display: flex; gap: 11px; padding-block: 5px; border-bottom: 1px solid var(--line); background: var(--paper2); overflow-x: auto; scrollbar-width: none; }
#res::-webkit-scrollbar { display: none; }
.rs { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; flex: none; }
.rs small { font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.rs b { font: 600 14px var(--mono); }
.rs em { font: 500 11px var(--mono); font-style: normal; }
.up { color: var(--good); } .down { color: var(--warn); }

#stage { position: relative; overflow: hidden; background: var(--sea); min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.prov { stroke: var(--stroke); stroke-width: .7; fill-opacity: .88; cursor: pointer; }
.bd { fill: none; stroke: var(--stroke); stroke-width: .5; opacity: .55; pointer-events: none; }
.bd.nat { stroke: var(--ink); stroke-width: 1.5; opacity: .85; }
.coast { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .5; pointer-events: none; }
.stl { fill: none; stroke: var(--ink); stroke-width: .8; opacity: .4; stroke-linejoin: round; pointer-events: none; }
.stlab { font-family: var(--mono); font-weight: 600; fill: var(--badge-ink); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.35); opacity: .8; }
.city { fill: var(--badge-ink); pointer-events: none; }
.sealane { fill: none; stroke: var(--ink2); stroke-dasharray: 3 5; stroke-width: 1; pointer-events: none; opacity: .8; }
.lab { font-family: var(--mono); font-weight: 600; fill: var(--badge-ink); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.35); stroke-width: 2px; }
.capdot { fill: none; stroke: var(--badge-ink); stroke-width: 1.4; pointer-events: none; }
.hit { fill: transparent; }
.selout { fill: none; stroke: var(--sel); stroke-width: 2.4; pointer-events: none; }
.route { fill: none; stroke: var(--sel); stroke-width: 1.8; stroke-dasharray: 5 4; pointer-events: none; }
.route.faint { stroke-width: 1.2; opacity: .45; }
.bdg rect { stroke: var(--badge-ink); stroke-width: 1; }
.bdg text { font: 700 9px var(--mono); fill: var(--badge-ink); text-anchor: middle; pointer-events: none; }
.bdg .dir { fill: var(--badge-ink); }
.bdg.sel rect { stroke: var(--sel); stroke-width: 2.4; }
.bdg.foe rect { stroke-dasharray: 0; }
.bdg .hull { stroke: var(--badge-ink); stroke-width: 1; }
.utab { width: 100%; border-collapse: collapse; margin: 6px 0 4px; font-size: 13px; }
.utab th { text-align: left; font: 600 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink2); padding: 2px 4px 4px 0; }
.utab td { padding: 3px 4px 3px 0; border-top: 1px solid var(--line); }
.utab th:not(:first-child), .utab td:not(:first-child) { text-align: right; width: 3.6em; }
.bdg .sym { fill: none; stroke: var(--badge-ink); stroke-width: 1.1; stroke-linejoin: round; stroke-linecap: round; pointer-events: none; }
.route { stroke-linejoin: round; stroke-linecap: round; }
.route.drag { stroke: var(--hot); opacity: 1; }
.route.drag.bad { stroke: var(--warn); }
.dragEta { font-family: var(--mono); font-weight: 700; fill: var(--ink); stroke: var(--paper); paint-order: stroke; text-anchor: middle; pointer-events: none; }
.bdg.sel .hull { stroke: var(--sel); stroke-width: 2.4; }
.bdg.strike rect { stroke-dasharray: 2 1.5; }
.fxr { fill: none; stroke-width: 2; pointer-events: none; }
.mapctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--paper); }
.mapctl button { width: 36px; height: 36px; border: 0; border-bottom: 1px solid var(--line); background: none; font: 600 17px var(--mono); cursor: pointer; }
.mapctl button:last-child { border-bottom: 0; font-size: 11px; }
#toasts { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; right: 58px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.toast { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--ink2); padding: 6px 9px; font-size: 13px; max-width: 420px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.toast.war, .toast.bad { border-left-color: var(--warn); } .toast.ok, .toast.peace, .toast.treaty { border-left-color: var(--good); }
.toast.capture { border-left-color: var(--hot); } .toast.proposal { border-left-color: #4C8DF2; } .toast.elim, .toast.revolt { border-left-color: #9B7DE8; }

#side { display: flex; flex-direction: column; min-height: 0; max-height: 42vh; border-top: 2px solid var(--ink); background: var(--paper); }
#side[data-tab="forces"], #side[data-tab="dip"], #side[data-tab="intel"] { max-height: 62vh; }
#side.collapsed #sheet { display: none; }
#sheet { overflow-y: auto; overscroll-behavior: contain; padding: 10px var(--gr) 12px var(--gl); flex: 1; min-height: 0; }
#tabs { display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--line); background: var(--paper2); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs button { background: none; border: 0; border-top: 3px solid transparent; padding: 8px 4px 9px; font: 800 15px var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); cursor: pointer; position: relative; min-height: 40px; }
#tabs button[aria-selected="true"] { color: var(--ink); border-top-color: var(--ink); background: var(--paper); }
#tabs .badge { position: absolute; top: 3px; right: 4px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--warn); color: #fff; font: 700 11px/17px var(--mono); text-align: center; padding: 0 4px; }

h3 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
h4 { margin: 14px 0 6px; font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
h4:first-child { margin-top: 0; }
@media (max-width: 480px) { #tabs button { font-size: 13px; letter-spacing: .03em; padding-left: 2px; padding-right: 2px; } }
.btn.tech.done { border-color: var(--good); }
.cat { margin: 8px 0 2px; font: 600 10px var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3, var(--ink2)); }
.hd { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
.hd small { font: 500 12px var(--mono); color: var(--ink2); }
.dot { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--ink); vertical-align: -1px; flex: none; }
.tag { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); font: 600 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.tag.war { color: var(--warn); border-color: var(--warn); } .tag.good { color: var(--good); border-color: var(--good); } .tag.hot { color: var(--hot); border-color: var(--hot); }
.kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 6px 14px; margin: 6px 0 4px; }
.kv span { display: block; font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.kv b { font: 500 14px var(--mono); }
.bar { height: 5px; background: var(--paper2); border: 1px solid var(--line); margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--ink); }
.bar.warn i { background: var(--warn); }
.blds { display: grid; grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 6px; margin: 6px 0; }
.btn.bld { width: 100%; min-width: 0; }
.bld .bn { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
.bld small.ef { font-family: var(--body); font-size: 11.5px; }
.pips { display: inline-flex; gap: 2px; flex: none; }
.pips i { width: 7px; height: 7px; border: 1px solid currentColor; }
.pips i.on { background: currentColor; }
.pips i.q { background: repeating-linear-gradient(45deg, currentColor 0 1.5px, transparent 1.5px 3px); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.btn { background: var(--paper); border: 1px solid var(--ink); color: var(--ink); padding: 6px 11px; min-height: 36px; font: 600 13px var(--body); cursor: pointer; border-radius: 2px; text-align: left; line-height: 1.15; }
.btn small { display: block; font: 500 10.5px var(--mono); color: var(--ink2); margin-top: 2px; }
.btn.pri { background: var(--ink); color: var(--bg); } .btn.pri small { color: inherit; opacity: .75; }
.btn.warn { color: var(--warn); border-color: var(--warn); }
.btn.dim { opacity: .5; }
.btn:focus-visible, .speed button:focus-visible, #tabs button:focus-visible, .mapctl button:focus-visible, .row:focus-visible { outline: 2px solid var(--hot); outline-offset: 1px; }
.row { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; }
.row .sub { color: var(--ink2); font-size: 12.5px; overflow-wrap: anywhere; }
.row .num { font: 500 13px var(--mono); text-align: right; flex: none; }
.pill { display: inline-block; margin: 0 4px 0 0; padding: 0 5px; font: 700 10px/16px var(--mono); border: 1px solid currentColor; vertical-align: 1px; }
.note { color: var(--ink2); font-size: 13px; margin: 6px 0; }
.msg { margin: 8px 0; padding: 7px 9px; border-left: 3px solid var(--hot); background: var(--paper2); font-size: 13px; }
.logl { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line); font-size: 13px; }
.logl time { font: 500 11px var(--mono); color: var(--ink2); flex: none; min-width: 44px; white-space: nowrap; padding-top: 2px; }
.logl.war { color: var(--warn); } .logl.capture { color: var(--hot); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
th { font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
td:first-child, th:first-child { text-align: left; }
td.mono { font-size: 12.5px; }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
details p { margin: 4px 0 8px; color: var(--ink2); }
.opn { font: 500 12.5px var(--mono); }
.part { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 1px 0; }
.part b { font: 500 12.5px var(--mono); }

#modal { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: max(18px, env(safe-area-inset-top, 0px)) var(--gr) max(18px, env(safe-area-inset-bottom, 0px)) var(--gl); }
#modal[hidden] { display: none; }
.mwrap { max-width: 760px; margin: 0 auto; }
.title { font: 800 clamp(40px, 11vw, 74px)/.9 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 6px 0 6px; }
.lede { color: var(--ink2); max-width: 46ch; margin: 0 0 14px; font-size: 15px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 10px 0 16px; }
.nc { text-align: left; background: var(--paper); border: 1px solid var(--line); padding: 0; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.nc:hover, .nc:focus-visible { border-color: var(--ink); outline: none; }
.nc .strip { height: 8px; }
.nc .in { padding: 8px 10px 10px; }
.nc b { display: block; font: 800 17px/1.05 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.nc span { display: block; font-size: 12px; color: var(--ink2); margin-top: 3px; }
.nc .st { font: 500 11.5px var(--mono); color: var(--ink); margin-top: 6px; }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { background: none; border: 0; border-right: 1px solid var(--ink); padding: 7px 13px; font: 600 13px var(--body); cursor: pointer; min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.opts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0 4px; }

@media (min-width: 920px) {
  #app { grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto auto minmax(0, 1fr); }
  #top, #res { grid-column: 1 / -1; }
  #side { grid-column: 2; grid-row: 3; max-height: none !important; border-top: 0; border-left: 2px solid var(--ink); }
  #stage { grid-column: 1; grid-row: 3; }
  #side { flex-direction: column-reverse; }
  #side.collapsed #sheet { display: block; }
  #tabs { border-top: 0; border-bottom: 1px solid var(--line); }
  #tabs button { border-top: 0; border-bottom: 3px solid transparent; }
  #tabs button[aria-selected="true"] { border-bottom-color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
<div id="app">
  <header id="top">
    <div class="who"><i id="whoDot"></i><b id="whoName">Frontline USA</b><span id="clock" class="mono"></span></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button data-act="speed" data-v="0" aria-label="Pause" aria-pressed="false">II</button>
      <button data-act="speed" data-v="1" aria-pressed="true">1&times;</button>
      <button data-act="speed" data-v="4" aria-pressed="false">4&times;</button>
      <button data-act="speed" data-v="16" aria-pressed="false">16&times;</button>
    </div>
  </header>
  <div id="res" class="mono"></div>
  <main id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the United States divided into provinces"></svg>
    <div id="toasts" aria-live="polite"></div>
    <div class="mapctl"><button data-act="zoom" data-v="1.5" aria-label="Zoom in">+</button><button data-act="zoom" data-v="0.67" aria-label="Zoom out">&minus;</button><button data-act="fit" aria-label="Fit map">FIT</button></div>
  </main>
  <aside id="side" data-tab="map">
    <div id="sheet"></div>
    <nav id="tabs" role="tablist">
      <button role="tab" data-act="tab" data-v="map" aria-selected="true">Map</button>
      <button role="tab" data-act="tab" data-v="forces" aria-selected="false">Forces</button>
      <button role="tab" data-act="tab" data-v="dip" aria-selected="false">Diplomacy<span class="badge" id="dipBadge" hidden></span></button>
      <button role="tab" data-act="tab" data-v="tech" aria-selected="false">Tech</button>
      <button role="tab" data-act="tab" data-v="intel" aria-selected="false">Intel</button>
    </nav>
  </aside>
</div>
<div id="modal" hidden></div>

      .filter(x => x.tt < 45).sort((x, y) => x.tt - y.tt);
    for (const c of cands) {
      if (have > t.thr * 1.1) break;
      order(c.s, t.pid); have += unitPow(c.s.u);
      c.s.hold = G.t + c.tt + 15;
    }
  }
  stacks = stacks.filter(s => !used.has(s));
  if (defOnly) return;

  // 3. offence
  if (wars.length && stacks.length) {
    // opportunistic strikes from where we already stand
    for (const s of stacks.slice()) {
      for (const q of PS[s.at].nbrs) {
        const o = G.provs[q].owner;
        if (!atWar(nid, o) || !canEnter(nid, q)) continue;
        const pr = predictAttack(nid, s.u, q);
        if (pr.win && pr.keep > 0.65) { order(s, q); break; }
      }
    }
    stacks = stacks.filter(s => !used.has(s));
    if (stacks.length) {
      const cand = [];
      for (const e of wars) for (const tp of D.owned[e]) for (const r of PS[tp].nbrs) {
        const R = G.provs[r];
        if (R.owner === nid || allied(R.owner, nid)) cand.push({ R: r, T: tp, e });
      }
      const total = sumUnits(stacks);
      const cache = {};
      let best = null;
      const keepNeed = clamp(0.55 / Math.pow(aggr, 1.2), 0.25, 0.7);
      for (const c of cand) {
        const pr = cache[c.T] || (cache[c.T] = predictAttack(nid, total, c.T));
        const win = pr.win && pr.keep >= keepNeed;
        let score = provValue(c.T, nid) * (win ? 1 : 0.05) + (win ? pr.keep * 2 : 0);
        if (n.ai.focus && n.ai.focus.T === c.T && n.ai.focus.R === c.R && G.t - n.ai.focus.t < 90) score *= 1.6;
        if (!best || score > best.score) best = { ...c, score, win, pr };
      }
      if (best && best.win) {
        if (!n.ai.focus || n.ai.focus.T !== best.T || n.ai.focus.R !== best.R) n.ai.focus = { R: best.R, T: best.T, t: G.t };
        const atR = stacks.filter(s => s.at === best.R);
        if (atR.length) {
          const u = sumUnits(atR);
          const pr = predictAttack(nid, u, best.T);
          if (pr.win && pr.keep >= keepNeed * 0.9) {
            mergeIdle(nid);
            const merged = G.armies.find(a => a.owner === nid && a.at === best.R && !a.mv && domOf(a) === 'land');
            if (merged) order(merged, best.T);
          }
        }
        for (const s of stacks) if (!used.has(s) && s.at !== best.R && G.armies.includes(s)) order(s, best.R);
      } else {
        n.ai.focus = null;
        // nothing winnable yet: mass at the busiest front and keep building
        const fronts = [...new Set(cand.map(c => c.R))];
        if (fronts.length) {
          const fts = {};
          for (const f of fronts) fts[f] = threatScore(nid, f);
          fronts.sort((a, b) => fts[b] - fts[a]);
          for (const s of stacks) if (!used.has(s) && !fronts.includes(s.at)) order(s, fronts[0]);
        }
      }
    }
  }

  // 4. peacetime posture: move interior stacks to the border
  stacks = stacks.filter(s => !used.has(s) && G.armies.includes(s));
  if (stacks.length) {
    const fronts = D.owned[nid].filter(pid => PS[pid].nbrs.some(q => G.provs[q].owner !== nid && !allied(G.provs[q].owner, nid)));
    if (fronts.length) {
      const fts = {};
      for (const f of fronts) fts[f] = threatScore(nid, f);
      const load = {};
      for (const a of G.armies) if (a.owner === nid) { const loc = a.at != null ? a.at : a.mv.to; load[loc] = (load[loc] || 0) + unitPow(a.u); }
      for (const s of stacks) {
        if (fronts.includes(s.at) || s.route.length) continue;
        let bp = -1, bs = -Infinity;
        for (const f of fronts) {
          const d = tt(s, f);
          const sc = fts[f] * 400 - (load[f] || 0) * 0.5 - (d === Infinity ? 600 : d * 2);
          if (sc > bs) { bs = sc; bp = f; }
        }
        if (bp >= 0) { orderMove(s, bp); load[bp] = (load[bp] || 0) + unitPow(s.u); }
      }
    }
  }
}

// fleets: fight or fall back, sink enemy ships, shell enemy ports (which keeps their garrison down
// for the land attack), and gather in a home port in peacetime
function aiNavy(n, defOnly) {
  const nid = n.id, wars = enemiesOf(nid);
  const fleets = G.armies.filter(a => a.owner === nid && available(a) && domOf(a) === 'sea' && !(a.hold > G.t));
  if (!fleets.length) return;
  const mine = f => f.nat === nid || allied(f.nat, nid);
  for (const s of fleets) {
    const here = s.at, p = G.provs[here];
    if (p.battle) {
      const fs = forcesIn(here, true);
      for (let i = 0; i < 60; i++) roundForces(fs, 1, false);
      const ml = fs.filter(mine).reduce((x, f) => x + unitCount(f.u), 0), fl = fs.filter(f => atWar(f.nat, nid)).reduce((x, f) => x + unitCount(f.u), 0);
      if (ml < 0.5 && fl > 1) {
        const esc = SEA_NB[here].filter(q => canEnter(nid, q) && !hostileHere(nid, q)).sort((a, b) => (G.provs[b].owner === nid) - (G.provs[a].owner === nid))[0];
        if (esc !== undefined) { orderMove(s, esc); continue; }
      }
      s.hold = G.t + 6;
      continue;
    }
    // shelling a port whose garrison is gone: stay a while if our troops are coming
    if (p.owner !== nid && atWar(nid, p.owner) && G.t - s.since < 50 && PS[here].nbrs.some(q => (D.armyAt[q] || []).some(a => a.owner === nid))) continue;
    let best = -1, bs = 0;
    if (wars.length && !defOnly) {
      const dj = dijkstra(nid, here, armySpeed(s), undefined, 'sea');
      const focus = n.ai.focus && n.ai.focus.T;
      for (let pid = 0; pid < NP; pid++) {
        if (!PS[pid].coast || pid === here || !(dj.dist[pid] < 90)) continue;
        const o = G.provs[pid].owner;
        const fleet = (D.armyAt[pid] || []).filter(a => atWar(nid, a.owner) && domOf(a) === 'sea').reduce((x, a) => x + unitPow(a.u), 0);
        if (!atWar(nid, o) && !fleet) continue;
        let sc = fleet / 150 + (atWar(nid, o) ? 0.3 * provValue(pid, nid) : 0) + (pid === focus ? 4 : 0) - dj.dist[pid] * 0.03;
        if (PS[pid].nbrs.some(q => (D.armyAt[q] || []).some(a => a.owner === nid && domOf(a) === 'land'))) sc += 2;
        if (sc <= bs) continue;
        const pr = predictAttack(nid, s.u, pid);
        if (pr.win && pr.keep > 0.5) { bs = sc; best = pid; }
      }
    }
    // defend our own coast against raiding fleets
    if (best < 0) for (const pid of D.owned[nid]) {
      if (!PS[pid].coast || pid === here) continue;
      if (!(D.armyAt[pid] || []).some(a => atWar(nid, a.owner) && domOf(a) === 'sea')) continue;
      const pr = predictAttack(nid, s.u, pid);
      if (pr.win && pr.keep > 0.4) { best = pid; break; }
    }
    if (best >= 0) { orderMove(s, best); continue; }
    // otherwise gather in the home port: our best naval base, or the capital's coast
    if (p.owner === nid && p.b.naval) {
      let port = here, pv = -1;
      for (const pid of D.owned[nid]) { const q = G.provs[pid]; const v = q.b.naval * 2 + threatScore(nid, pid); if (PS[pid].coast && q.b.naval && v > pv) { pv = v; port = pid; } }
      if (port !== here && SEA_NB[here].length && Math.random() < 0.5) orderMove(s, port);
    } else if (p.owner !== nid) {
      const home = D.owned[nid].find(pid => G.provs[pid].b.naval) ;
      if (home !== undefined) orderMove(s, home);
    }
  }
}
// missiles: fire at the biggest enemy concentration, a dug-in province we are attacking, or a fleet
function aiMissiles(n) {
  const nid = n.id, wars = enemiesOf(nid);
  if (!wars.length) return;
  const sal = G.armies.filter(a => a.owner === nid && available(a) && domOf(a) === 'msl' && !a.strike);
  if (!sal.length) return;
  const focus = n.ai.focus && n.ai.focus.T;
  const cands = new Set();
  for (const e of wars) for (const pid of D.owned[e]) if (PS[pid].nbrs.some(q => G.provs[q].owner === nid || allied(G.provs[q].owner, nid)) || PS[pid].coast) cands.add(pid);
  for (const a of G.armies) if (a.at != null && atWar(nid, a.owner)) cands.add(a.at);
  for (const s of sal) {
    let best = -1, bs = 2.5 + 0.8 * s.u.msl;
    for (const pid of cands) {
      if (!inRange(s.at, pid, nid)) continue;
      const p = G.provs[pid];
      let sc = 0;
      for (const a of D.armyAt[pid] || []) if (atWar(nid, a.owner)) sc += unitPow(a.u) / 120;
      if (atWar(nid, p.owner)) {
        sc += p.garrison * 0.25 + (p.b.fort + p.b.bunk + p.b.aa) * 0.5;
        if (pid === focus) sc *= 2;
        if ((D.armyAt[pid] || []).some(a => a.owner === nid)) sc *= 1.5;
        if (isCapital(p)) sc += 1;
      }
      sc -= (p.b.aa + (D.armyAt[pid] || []).reduce((x, a) => x + a.u.flak + a.u.ftr, 0)) * 0.3;
      if (sc > bs) { bs = sc; best = pid; }
    }
    if (best >= 0) { orderMove(s, best); continue; }
    // nothing in range: move up to a city closer to the enemy
    let to = -1, dmin = Infinity;
    for (const pid of D.owned[nid]) {
      if (pid === s.at || !inRange(s.at, pid, nid) || G.provs[pid].battle) continue;
      let d = Infinity;
      for (const c of cands) d = Math.min(d, mslDist(pid, c));
      if (d < dmin - 30) { dmin = d; to = pid; }
    }
    let dnow = Infinity;
    for (const c of cands) dnow = Math.min(dnow, mslDist(s.at, c));
    if (to >= 0 && ![...cands].some(c => inRange(s.at, c, nid)) && dmin < dnow) orderMove(s, to);
  }
}

// ---------------------------------------------------------------- AI : diplomacy
function shouldSeekPeace(a, e) {
  const ws = warStat(a, e), P = pers(G.nations[a]);
  const ratio = D.power[a] / Math.max(1, D.power[e]);
  const sc = (1 - ratio) * 1.6 + clamp(ws.dur / 500, 0, 1.2) - (ws.a - ws.b) * 0.25 + (G.t - ws.last > 150 ? 0.4 : 0) - (P.aggr - 1) * 0.5;
  return ws.dur > 40 && sc > 0.55;
}
function aiWar(n) {
  const nid = n.id, P = pers(n);
  const aggr = P.aggr * (G.opts.diff === 'hard' ? 1.15 : G.opts.diff === 'easy' ? 0.8 : 1);
  if (G.t < G.grace) return;
  const wars = enemiesOf(nid);
  if (wars.length >= (aggr > 1.2 ? 2 : 1)) return;
  if (G.t - n.ai.lastWar < 120) return;
  if (Math.random() > 0.3) return;
  let best = null;
  for (const c of G.nations) {
    if (!c.alive || c.id === nid || atWar(nid, c.id) || allied(nid, c.id) || truceLeft(nid, c.id) > 0) continue;
    if (!inContact(nid, c.id)) continue;
    let my = D.power[nid], th = D.power[c.id];
    for (const x of G.nations) {
      if (!x.alive || x.id === nid || x.id === c.id) continue;
      if (allied(c.id, x.id) && !allied(nid, x.id)) th += D.power[x.id] * 0.6;
      if (allied(nid, x.id) && !allied(c.id, x.id)) my += D.power[x.id] * 0.4;
    }
    const ratio = my / Math.max(1, th);
    const hegemon = D.share[c.id] > 0.27 && D.share[nid] < D.share[c.id];
    // no vultures: a nation already at war is left alone unless it is a runaway power
    // (opportunists may still join a one-front war if they are clearly stronger)
    const busy = enemiesOf(c.id).length;
    if (!hegemon && busy >= 2) continue;
    if (!hegemon && busy === 1 && n.pers !== 'opportunist') continue;
    let need = 1.25 / aggr;
    need *= clamp(1 - (G.t - n.ai.lastWar - 180) / 2400, 0.78, 1);     // restlessness after long peace
    if (hegemon) need *= 0.75;
    if (hasTreaty(nid, c.id, 'nap') || hasTreaty(nid, c.id, 'trade')) need *= 1.35;
    if (busy === 1 && !hegemon) need *= 1.3;
    if (ratio < need) continue;
    let prize = 0;
    for (const pid of D.owned[c.id]) if (PS[pid].nbrs.some(q => G.provs[q].owner === nid)) prize += provValue(pid, nid);
    const score = (ratio - need) * 2 + prize * 0.05 - opinion(nid, c.id).total * 0.01 + (hegemon ? 1 : 0);
    if (!best || score > best.score) best = { id: c.id, score };
  }
  if (best) { n.ai.warTarget = best.id; declareWar(nid, best.id, 'ambition'); n.ai.lastWar = G.t; }
}
function cd(n, k, secs) { if ((n.ai.tprop[k] || 0) > G.t) return false; n.ai.tprop[k] = G.t + secs; return true; }
function aiDiplomacy(n) {
  const nid = n.id, P = pers(n);
  // peace
  for (const e of enemiesOf(nid)) {
    if (!shouldSeekPeace(nid, e)) continue;
    const E = G.nations[e];
    if (E.player) { if (cd(n, 'cf' + e, 90)) propose(nid, e, 'ceasefire', 'proposes a ceasefire.', {}, 50); }
    else if (evalProposal('ceasefire', e, nid).ok) makePeace(nid, e);
  }
  // allies join our wars: when we were attacked, or against a runaway power
  for (const e of enemiesOf(nid)) for (const x of alliesOf(nid)) {
    if (warStat(nid, e).by === nid && !(D.share[e] > 0.27)) continue;
    if (enemiesOf(e).length >= 3) continue;
    const X = G.nations[x];
    if (atWar(x, e) || truceLeft(x, e) > 0 || allied(x, e)) continue;
    if (X.player) { if (cd(n, 'jw' + e + x, 120)) propose(nid, x, 'joinwar', `asks you to join the war against ${G.nations[e].short}.`, { target: e }, 60); }
    else if (enemiesOf(x).length < 2 && evalProposal('callarms', x, nid, e).ok && Math.random() < 0.5) declareWar(x, e, 'ally');
  }
  // treaties
  const others = alive().filter(o => o.id !== nid && !atWar(nid, o.id)).sort(() => Math.random() - 0.5).slice(0, 3);
  for (const o of others) {
    if (Math.random() > 0.25 * P.diplo) continue;
    const kinds = ['trade', 'nap', 'access', 'alliance'].filter(k => {
      if (k === 'trade') return !hasTreaty(nid, o.id, 'trade');
      if (k === 'nap') return !hasTreaty(nid, o.id, 'nap') && !allied(nid, o.id);
      if (k === 'access') return !hasAccess(nid, o.id);
      if (k === 'alliance') return !allied(nid, o.id) && D.share[nid] < 0.45;
    });
    if (!kinds.length) continue;
    const k = kinds[Math.floor(Math.random() * kinds.length)];
    if (!cd(n, k + o.id, 100)) continue;
    if (!evalProposal(k, nid, o.id).ok) continue;           // we only offer what we would accept ourselves
    if (o.player) propose(nid, o.id, k, ({ trade: 'offers a trade pact.', nap: 'offers a non-aggression pact.', access: 'asks for passage rights.', alliance: 'proposes an alliance.' })[k], {}, 60);
    else if (evalProposal(k, o.id, nid).ok) applyAgreement(k, nid, o.id);
  }
  // keep friendships warm
  for (const o of alive()) if (o.id !== nid && !atWar(nid, o.id) && (hasTreaty(nid, o.id, 'trade') || allied(nid, o.id)) && Math.random() < 0.4) remember(nid, o.id, 'Peaceful relations', 2, 400, 15);
  // renew expiring pacts
  for (const t of G.treaties.slice()) {
    if (!t.exp || (t.type !== 'nap' && t.type !== 'access')) continue;
    if (t.a !== nid && t.b !== nid) continue;
    if (t.exp - G.t > 45) continue;
    const o = t.a === nid ? t.b : t.a;
    if (G.nations[o].player) continue;
    if (evalProposal(t.type, nid, o).ok || opinion(nid, o).total > 10) { t.exp = G.t + 360; }
  }
  // the strong lean on the weak
  const me = G.opts.player;
  if (me >= 0 && G.nations[me].alive && !atWar(nid, me) && !allied(nid, me) && G.t > G.grace + 60 && G.t - (n.ai.lastTribute || 0) > 300 &&
      D.power[nid] > D.power[me] * 2 && borders(nid, me) && pers(n).aggr > 0.9 && Math.random() < 0.15) {
    n.ai.lastTribute = G.t;
    const amt = Math.round(Math.max(80, G.nations[me].cash * 0.25));
    propose(nid, me, 'tribute', `demands ${amt} cash as tribute.`, { amount: amt }, 60);
  }
}
// Runs an absent player's nation: keeps recruiting and building defences, defends, and takes peace
// when the war is going badly. Accepts offered trade and non-aggression pacts. Never declares war, attacks,
// or signs anything else (alliances, passage, tribute, joining wars).
function caretaker(n) {
  if (!n.alive) return;
  aiEconomy(n);
  aiMilitary(n, true);
  aiNavy(n, true);
  for (const pr of G.proposals.slice()) {
    if (pr.to !== n.id) continue;
    if (pr.kind === 'ceasefire' && (shouldSeekPeace(n.id, pr.from) || evalProposal('ceasefire', n.id, pr.from).ok)) answerProposal(pr.id, true);
    else if (pr.kind === 'trade' || pr.kind === 'nap') answerProposal(pr.id, true);     // harmless goodwill
  }
}
function aiThink(n) {
  if (!n.alive) return;
  opMemo = new Map();
  aiEconomy(n);
  aiMilitary(n);
  aiNavy(n);
  aiMissiles(n);
  aiResearch(n);
  n.ai.cycle = (n.ai.cycle || 0) + 1;
  opMemo = null;
  if (n.ai.cycle % 4 === 0) { aiDiplomacy(n); aiWar(n); }
}

// ---------------------------------------------------------------- player commands
function cmdRecruit(nat, pid, type) {
  const n = G.nations[nat], p = G.provs[pid];
  if (p.owner !== nat) return { ok: false, msg: 'Not your province' };
  if (p.cap || p.siege) return { ok: false, msg: 'Province is under siege' };
  if (!canTrain(p, type)) return { ok: false, msg: needText(p, type) };
  if (p.q.length >= 6) return { ok: false, msg: 'Training queue is full' };
  const c = unitCost(type);
  if (!canPay(n, c)) return { ok: false, msg: 'Not enough resources' };
  pay(n, c);
  const tm = trainTime(p, type);
  p.q.push({ type, left: tm, total: tm });
  return { ok: true, msg: `${UNITS[type].n} queued` };
}
function cmdBuild(nat, pid, kind) {
  const n = G.nations[nat], p = G.provs[pid], B = BLD[kind];
  if (!B) return { ok: false, msg: 'Unknown building' };
  if (p.owner !== nat) return { ok: false, msg: 'Not your province' };
  if (B.coast && !PS[pid].coast) return { ok: false, msg: 'Only coastal cities can have a naval base' };
  if (p.cap) return { ok: false, msg: 'Province is under occupation' };
  if (p.bq.length >= 3) return { ok: false, msg: 'Construction queue is full' };
  const lvl = plannedLvl(p, kind);
  if (lvl >= maxLvl(kind)) return { ok: false, msg: 'Already at maximum level' };
  const c = buildCost(kind, lvl);
  if (!canPay(n, c)) return { ok: false, msg: 'Not enough resources' };
  pay(n, c);
  const tm = buildTime(kind, lvl, nat);
  p.bq.push({ k: kind, left: tm, total: tm, c });
  return { ok: true, msg: `${B.n} level ${lvl + 1} under construction` };
}
// cancel the last queued project (or the current one when nothing else is queued), half refunded
function cmdCancelBuild(nat, pid) {
  const n = G.nations[nat], p = G.provs[pid];
  if (p.owner !== nat || !p.bq.length) return { ok: false, msg: 'Nothing under construction' };
  const it = p.bq.pop(), c = it.c || {};
  for (const k in c) n[k] += c[k] / 2;
  return { ok: true, msg: `${BLD[it.k].n} cancelled, half refunded` };
}
function cmdMove(aid, dest) {
  const a = G.armies.find(x => x.id === aid);
  if (!a) return { ok: false, msg: 'Army not found' };
  return orderMove(a, dest);
}
function cmdStop(aid) {
  const a = G.armies.find(x => x.id === aid);
  if (a) { a.route = []; a.held = null; }
}
function cmdSplit(aid, mode) {
  const a = G.armies.find(x => x.id === aid);
  if (!a || a.at == null) return { ok: false, msg: 'Army must be stationary' };
  const b = emptyU();
  if (mode === 'half') { for (const t of UT) { b[t] = a.u[t] / 2; a.u[t] -= b[t]; } }
  else if (mode === 'quarter') { for (const t of UT) { b[t] = a.u[t] / 4; a.u[t] -= b[t]; } }
  else if (UT.includes(mode)) { b[mode] = a.u[mode]; a.u[mode] = 0; }
  if (unitCount(b) < 0.5 || unitCount(a.u) < 0.5) { for (const t of UT) a.u[t] += b[t]; return { ok: false, msg: 'Too small to split' }; }
  const n = newArmy(a.owner, a.at); n.u = b;
  return { ok: true, msg: 'Army split', id: n.id };
}
function cmdMerge(nat, pid, dom) {
  let list = G.armies.filter(a => a.owner === nat && a.at === pid && !a.mv && !a.strike);
  // armies, fleets and missiles do not mix: merge the kind asked for, or the most common one here
  if (!dom) { const c = {}; for (const a of list) c[domOf(a)] = (c[domOf(a)] || 0) + 1; dom = Object.keys(c).sort((x, y) => c[y] - c[x])[0]; }
  list = list.filter(a => domOf(a) === dom);
  if (list.length < 2) return { ok: false, msg: 'Nothing to merge' };
  list.sort((x, y) => unitPow(y.u) - unitPow(x.u));
  for (let i = 1; i < list.length; i++) for (const t of UT) list[0].u[t] += list[i].u[t];
  const dead = new Set(list.slice(1));
  G.armies = G.armies.filter(a => !dead.has(a));
  list[0].route = [];
  return { ok: true, msg: 'Armies merged', id: list[0].id };
}
function cmdDisband(aid) {

// the points a unit passes on one leg: from anchor, border crossing (land only), to anchor
function legPts(from, to, sea) {

// position and heading a fraction k of the way along a polyline
function along(pts, k) {

    for (let i = 1; i < lp.length; i++) out.push(lp[i]);
    cur = r;
  }

}

      x = pos.x; y = pos.y + 9 * bk; ang = pos.ang;
    }

    e.g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${bk.toFixed(4)})`);
    const txt = String(Math.max(1, Math.round(S.unitCount(a.u))));

  const dash = `${(5 / UI.view.scale).toFixed(1)} ${(4 / UI.view.scale).toFixed(1)}`;
  const line = (pts, cls, w) => mk('path', { d: 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('L'), class: cls, 'stroke-width': (w / UI.view.scale).toFixed(2), 'stroke-dasharray': dash }, L.routes);
  for (const a of g.armies) {
    if (a.owner !== me() || (!a.route.length && !a.mv)) continue;
    const sel = a.id === UI.selA;
    if (!sel && !a.mv) continue;
    let start;
    if (a.mv) {
      const k = a.mv.dur ? a.mv.t / a.mv.dur : 0, leg = S.domOf(a) === 'msl' ? [[PS[a.mv.from].cx, PS[a.mv.from].cy], [PS[a.mv.to].cx, PS[a.mv.to].cy]] : legPts(a.mv.from, a.mv.to, S.domOf(a) === 'sea');

    h += `<tr title="${U.d}"><td>${U.n}</td><td class="mono" data-bind="ac:${a.id}:${t}">${f1(a.u[t])}</td><td class="mono">${f1(atk)}</td><td class="mono">${Math.round(hp)}</td><td class="mono">${U.spd}</td></tr>`;
  }
  h += '</table>';
  const here = a.at != null ? g.provs[a.at] : null;
  const friendly = here && (here.owner === a.owner || S.allied(a.owner, here.owner));
  const def = friendly && dom !== 'msl' ? S.defBonus(here) + S.entrench(a, here) : 0;
  h += `<div class="kvs">
    <div class="kv"><span>Firepower</span><b>${Math.round(fire)}</b></div>
    <div class="kv"><span>Toughness</span><b>${Math.round(tough)}</b></div>
    <div class="kv"><span>Speed</span><b>${S.armySpeed(a)}</b></div>
    <div class="kv"><span>Defence here</span><b>${here ? (def ? '+' + Math.round(def * 100) + '%' : 'none') : '-'}</b></div>
    ${here && friendly && dom !== 'msl' ? `<div class="kv"><span>Dug in</span><b>+${Math.round(S.entrench(a, here) * 100)}%</b></div>` : ''}
    <div class="kv"><span>Upkeep / s</span><b>${f2(types.reduce((s, t) => s + a.u[t] * UNITS[t].upk, 0))}</b></div>
  </div>`;
  // matchups: which enemy classes this force hits hard or barely scratches, and which hurt it most
  if (n > 0 && dom !== 'msl') {
    const good = [], poor = [], fear = [];
    for (const c in CLSN) {
      let w = 0, sum = 0, hit = 0, tw = 0;
      const rep = UT.find(t => UNITS[t].cls === c);
      for (const t of types) {
        const U = UNITS[t];
        sum += a.u[t] * U.atk; w += a.u[t] * U.atk * S.MULT[t][rep];
        tw += a.u[t] * S.TW[t]; hit += a.u[t] * S.TW[t] * S.CM[c][U.cls];
      }
      const r = sum ? w / sum : 0, f = tw ? hit / tw : 0;
      if (c === 'msl') continue;
      if (r >= 1.25) good.push(CLSN[c]); else if (r <= 0.35) poor.push(CLSN[c]);
      if (f >= 1.3) fear.push(CLSN[c]);
    }
    if (good.length) h += `<div class="note">Strong against ${good.join(', ')}.</div>`;
    if (poor.length) h += `<div class="note">Can barely hurt ${poor.join(', ')}.</div>`;
    if (fear.length) h += `<div class="note down">Vulnerable to ${fear.join(', ')}.</div>`;
  }
  return h;
}

// seconds until the current research project is done: stock pours in fast, then the income trickles in
function researchEta(n) {
  if (!n.rs) return 0;
  const rem = n.rs.need - n.rs.got, pr = S.pourRate(n), inc = Math.max(0.001, n.rate.rp);
  if (n.rp >= rem) return rem / pr;
  // the stock runs out first, then it goes at the income rate
  const tStock = n.rp / Math.max(0.001, pr - inc);
  const done = Math.min(rem, tStock * pr);
  return tStock + (rem - done) / inc;
}
function techPanel() {

  h += `<div class="kvs"><div class="kv"><span>Research points</span><b data-bind="rp">${Math.floor(n.rp)}</b></div><div class="kv"><span>Per second</span><b>${f2(n.rate.rp)}</b></div></div>`;

  } else h += '<p class="note">Nothing being researched. Pick a project below; your research points pour into it until it is done. Research labs make more points.</p>';

      const act = !done && open && !cur && !n.rs;

  <p>Drag an army badge onto a province to send it there, or tap the badge and then the province. The dashed line shows the route, and red means there is no way through. Armies cross at the border between provinces. One that runs into a fight on the way stops to fight, then carries on once it wins. Armies need passage rights to cross land you are at peace with.</p>
  <p>A badge's symbol shows what an army mostly is: a crossed box for infantry, an oval for armor, a dot for artillery, wings for aircraft. Its card lists every unit with attack, HP and speed (research included), plus what it is strong against and what it should avoid.</p>
  <p>Declare war from the Diplomacy tab. A province falls when its garrison is beaten and you hold it long enough. Fortifications, bunkers and home soil all make that take longer.</p>

  <p>Ground units win and hold land: tanks break infantry, artillery and special forces ignore half of all defence bonuses, mobile flak guards the army against aircraft. Helicopters and bombers hunt tanks and guns, interceptors win the sky, patrol aircraft find submarines. Air bases train aircraft and airborne troops; a level-2 base is needed for bombers.</p>

  } else if (UI.tab === 'dip') {
    if (m < 0) return s + '|observer';
    s += `|${UI.dipOpen}|${UI.dipMsg}|` + g.proposals.map(p => p.id).join(',') + '|' + g.nations.filter(o => o.alive).map(o => o.id + statusTags(m, o.id).length + Math.round(S.opinion(o.id, m).total / 4)).join(',');
  } else {
    s += '|' + g.seq + '|' + g.opts.pace + g.opts.away + '|' + g.nations.map(o => (o.alive ? 1 : 0) + ':' + S.D.owned[o.id].length).join(',');
  }
  return s;
}
let dirtyFlag = true;
function dirty() { dirtyFlag = true; }
function flush() { if (dirtyFlag && UI.started && G() && !UI.modal) { dirtyFlag = false; renderPanel(); } }
function setTab(t) {
  UI.tab = t;
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.v === t)));
  dirty();
}

// live numbers that change without a re-render
function updateBinds() {
  const g = G();
  document.querySelectorAll('#sheet [data-bind]').forEach(e => {
    const k = e.dataset.bind.split(':');
    let v = null;
    if (k[0] === 'g') { const p = g.provs[+k[1]]; v = `${f1(p.garrison)}/${f1(S.maxGar(p))}`; }
    else if (k[0] === 'un') v = Math.round(g.provs[+k[1]].unrest * 100) + '%';
    else if (k[0] === 'q') { const it = g.provs[+k[1]].q[+k[2]]; v = it ? fmtDur(it.left) : ''; }
    else if (k[0] === 'bq') { const b = (g.provs[+k[1]].bq || [])[+k[2]]; v = b ? fmtDur(b.left) : ''; }
    else if (k[0] === 'ac') { const a = army(+k[1]); v = a ? f1(a.u[k[2]]) : ''; }
    else if (k[0] === 'eta') { const a = army(+k[1]); v = a ? fmtDur(etaOf(a)) : ''; }
    else if (k[0] === 'rp') v = Math.floor(nat(me()).rp);
    else if (k[0] === 'rse') v = fmtDur(researchEta(nat(me())));
    if (v !== null && e.textContent !== String(v)) e.textContent = v;
  });
  document.querySelectorAll('#sheet [data-bar]').forEach(e => {
    const k = e.dataset.bar.split(':');
    if (k[0] === 'un') e.style.width = Math.round(g.provs[+k[1]].unrest * 100) + '%';
    else if (k[0] === 'bq') { const b = g.provs[+k[1]].bq[0]; e.style.width = b ? Math.round(100 * (1 - b.left / b.total)) + '%' : '100%'; }
    else if (k[0] === 'rs') { const rs = nat(me()).rs; e.style.width = rs ? Math.round(100 * rs.got / rs.need) + '%' : '100%'; }
  });
}

// ------------------------------------------------------------ header / resources
// campaign clock: real time the war has taken at 1x on this pace
function clockText(t, p) {
  const s = (t === undefined ? G().t : t) / (p || pace());
  const day = Math.floor(s / 86400) + 1, h = Math.floor(s % 86400 / 3600), mm = Math.floor(s % 3600 / 60);
  return `Day ${day} ${String(h).padStart(2, '0')}:${String(mm).padStart(2, '0')}`;
}
function renderHeader() {
  const g = G(), m = me(), n = m >= 0 ? nat(m) : null;
  $('#whoName').textContent = n ? n.short : 'Observer';
  $('#whoDot').style.background = n ? n.color : 'var(--ink2)';
  $('#clock').textContent = clockText() + (n ? ` \u00b7 ${S.D.owned[m].length} provinces` : '');
  if (!n) { $('#res').innerHTML = `<span class="rs"><small>${g.nations.filter(x => x.alive).length} nations alive</small></span>`; return; }
  const r = n.rate;
  const chip = (lab, val, rate) => `<span class="rs"><small>${lab}</small><b>${Math.floor(val)}</b><em class="${rate >= 0 ? 'up' : 'down'}">${sgn(rate)}</em></span>`;
  const units = S.D.armiesBy[m].reduce((s, a) => s + S.unitCount(a.u), 0);
  $('#res').innerHTML = chip('Cash', n.cash, r.net) + S.RES.filter(k => k !== 'cash').map(k => chip(S.RESN[k].s, n[k], r[k])).join('') + chip('Research', n.rp, r.rp) + `<span class="rs"><small>Army</small><b>${Math.round(units)}</b></span>`;
  const pend = g.proposals.filter(p => p.to === m).length, bd = $('#dipBadge');
  bd.hidden = !pend; bd.textContent = pend;
}

// ------------------------------------------------------------ modals
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="mwrap">${html}</div>`; m.hidden = false; UI.modal = true; m.scrollTop = 0; }
function closeModal() { $('#modal').hidden = true; UI.modal = false; }
let startDiff = 'normal', startPace = 'long', startAway = true;
const paceSeg = (cur, act) => `<div class="seg" role="group" aria-label="Game pace">${PACES.map(p => `<button data-act="${act}" data-v="${p.k}" aria-pressed="${p.k === cur}">${p.n}</button>`).join('')}</div>`;
const awaySeg = (on, act) => `<div class="seg" role="group" aria-label="World runs while away"><button data-act="${act}" data-v="1" aria-pressed="${!!on}">On</button><button data-act="${act}" data-v="0" aria-pressed="${!on}">Off</button></div>`;
const paceHint = k => PACES.find(p => p.k === k).hint;
function showStart() {
  let saved = null;
  try { const s = localStorage.getItem(SAVE_KEY); if (s) { const o = JSON.parse(s); if (S.saveOk(o)) saved = { day: clockText(o.t, o.opts.pace || 1), who: o.opts.player >= 0 ? o.nations[o.opts.player].short : 'Observer' }; } } catch (_) {}
  let cards = '';
  S.NATIONS.forEach((def, i) => {
    const ps = PS.filter(p => def.states.includes(p.st));
    const pop = ps.reduce((s, p) => s + p.pop, 0), inc = ps.reduce((s, p) => s + p.cash, 0);
    const cap = ps.filter(p => p.st === def.cap).sort((a, b) => b.pop - a.pop)[0];
    cards += `<button class="nc" data-act="pick" data-v="${i}"><div class="strip" style="background:${def.color}"></div><div class="in"><b>${def.name}</b><span>${def.states.length} states &middot; ${ps.length} provinces &middot; capital ${cap.name}</span><div class="st">${Math.round(pop)}M people &middot; $${inc.toFixed(1)}/s</div></div></button>`;
  });
  modal(`<div class="title">Frontline<br>USA</div>
  <p class="lede">Real-time grand strategy on the American map. Ten rival powers, one continent. No premium currency, no timers to buy out, no forced ending.</p>
  ${saved ? `<div class="btns"><button class="btn pri" data-act="continue">Continue &middot; ${saved.who}, ${saved.day}</button></div>` : ''}
  <h4>AI difficulty</h4>
  <div class="opts"><div class="seg" role="group" aria-label="AI difficulty">${['easy', 'normal', 'hard'].map(d => `<button data-act="diff" data-v="${d}" aria-pressed="${d === startDiff}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}</div></div>
  <h4>Game pace</h4>
  <div class="opts">${paceSeg(startPace, 'pace0')}</div><p class="note" id="paceHint">${paceHint(startPace)}</p>
  <h4>World keeps running while you are away</h4>
  <div class="opts">${awaySeg(startAway, 'away0')}</div>
  <p class="note">When on, the war goes on while this page is closed, like a real campaign. Your garrisons, forts and training queues carry on; your armies hold where you left them. While you are gone your generals only defend: idle armies move to cover threatened provinces, but they never attack, recruit or spend. A paused game stays frozen.</p>
  <h4>Choose your nation</h4>
  <div class="cards">${cards}</div>
  <div class="btns"><button class="btn" data-act="pick" data-v="-1">Watch the AI play</button></div>`);
}
function startNew(i) {
  S.newGame({ player: i, diff: startDiff, pace: PACES.find(p => p.k === startPace).v, away: startAway });
  afterStart();
}
function afterStart() {
  badges.forEach(e => e.g.remove()); badges.clear();
  fillCache.length = 0; bdCache.length = 0;
  UI.selA = null; UI.dipOpen = null; UI.dipMsg = ''; UI.confirm = ''; UI.lastSeq = G().seq; UI.started = true; UI.speed = 1;
  const m = me();
  UI.selP = m >= 0 ? nat(m).capital : null;
  setSpeed(1); setTab('map');
  closeModal();
  if (UI.W) { if (m >= 0) focusNation(m); else fitView(); }
  renderHeader(); renderPanel(); drawMap(performance.now());
  if (m >= 0) toast('Your armies are the numbered badges. Drag one onto a province to send it there.', 'ok');
}
function saveNow(quiet) {
  try { stamp(); localStorage.setItem(SAVE_KEY, S.serialize()); if (!quiet) toast('Game saved', 'ok'); }
  catch (_) { if (!quiet) toast('Could not save in this browser', 'bad'); }
}
function loadSaved() {
  try {
    const s = localStorage.getItem(SAVE_KEY);
    if (!s) return false;
    S.load(s); afterStart(); resumeFromSave(); return true;
  } catch (_) { return false; }
}
// remember when (in real time) the world was last advanced, and whether it was paused
function stamp() { const g = G(); if (g) { g.wall = Date.now(); g.paused = UI.speed === 0; } }
function resumeFromSave() {
  const g = G();
  if (g.paused) { setSpeed(0); toast('Paused. Press play to resume.', 'info'); return; }
  if (g.opts.away && g.wall) catchUp(Date.now() - g.wall);
}

// ------------------------------------------------------------ offline progress
// Run the world forward for the real time the player was away, in small slices so the page stays responsive.
let catching = false;
function catchUp(ms) {
  const g = G();
  if (catching || !g || !g.opts.away || ms < 4000) return;
  const want = ms / 1000 * pace(), secs = Math.min(want, MAX_AWAY);
  if (secs < 1) return;
  catching = true;
  const seq0 = g.seq, m = me(), owned0 = m >= 0 ? S.D.owned[m].length : 0, t0 = g.t;
  modal(`<div class="title">While you were away</div><p class="lede">${fmtDur(want)} have passed. Catching the world up&hellip;</p><div class="bar"><i id="cuBar" style="width:0%"></i></div>`);
  let done = 0;
  const slice = () => {
    const end = performance.now() + 30;
    G().caretaker = true;     // your generals hold the line while you are gone
    while (done < secs && performance.now() < end) { const d = Math.min(5, secs - done); S.advance(d); done += d; }
    G().caretaker = false;
    const bar = document.getElementById('cuBar');
    if (bar) bar.style.width = Math.round(100 * done / secs) + '%';
    if (done < secs) { setTimeout(slice, 0); return; }
    catching = false;
    stamp();
    const gg = G(), ev = gg.log.filter(e => e.s > seq0 && e.kind !== 'proposal' && (e.me || e.kind === 'elim'));
    const offers = gg.proposals.filter(p => p.to === m).length;
    const lines = ev.slice(-14).map(e => `<div class="logl ${e.kind}"><time>${clockText(e.t)}</time><span>${e.txt}</span></div>`).join('');
    const now = m >= 0 ? S.D.owned[m].length : 0;
    const head = m >= 0 ? (!gg.nations[m].alive ? 'Your nation fell while you were away.' : now === owned0 ? `You still hold all ${now} of your provinces.` : now > owned0 ? `You now hold ${now} provinces (up from ${owned0}).` : `You hold ${now} provinces, down from ${owned0}.`) : '';
    UI.lastSeq = gg.seq;
    modal(`<div class="title">While you were away</div><p class="lede">${fmtDur(gg.t - t0)} of war went by${want > secs ? ` (the world moves at most ${fmtDur(MAX_AWAY)} while you are gone)` : ''}. ${head}</p>${lines || '<p class="note">Nothing important happened on your borders.</p>'}${offers ? `<p class="note">${offers} diplomatic offer${offers > 1 ? 's are' : ' is'} waiting in the Diplomacy tab.</p>` : ''}<div class="btns"><button class="btn pri" data-act="keep">Continue</button></div>`);
    renderHeader(); dirty();
  };
  setTimeout(slice, 0);
}

// ------------------------------------------------------------ actions (delegated clicks)
function setSpeed(v) {
  UI.speed = v;
  document.querySelectorAll('.speed button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
}
function doDip(action, to, x) {
  const r = S.diplo(action, me(), to, x);
  UI.dipMsg = r.msg;
  if (action === 'war' && r.ok) { UI.dipMsg = r.msg; }
  UI.confirm = '';
  toast(r.msg, r.ok ? 'ok' : 'bad');
  dirty();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, d = t.dataset;
  const m = G() ? me() : -1;
  switch (act) {
    case 'speed': setSpeed(+d.v); break;
    case 'tab': if (d.v === UI.tab) $('#side').classList.toggle('collapsed'); else { $('#side').classList.remove('collapsed'); setTab(d.v); } break;
    case 'zoom': { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, +d.v); break; }
    case 'fit': fitView(); break;
    case 'pick': startNew(+d.v); break;
    case 'pace0': startPace = d.v; document.querySelectorAll('[data-act="pace0"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === startPace))); { const h = $('#paceHint'); if (h) h.textContent = paceHint(startPace); } break;
    case 'away0': startAway = d.v === '1'; document.querySelectorAll('[data-act="away0"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === d.v))); break;
    case 'pace': G().opts.pace = PACES.find(p => p.k === d.v).v; toast(`Pace set to ${PACES.find(p => p.k === d.v).n}`, 'ok'); dirty(); break;
    case 'away': G().opts.away = d.v === '1'; stamp(); dirty(); break;
    case 'diff': startDiff = d.v; document.querySelectorAll('[data-act="diff"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === startDiff))); break;
    case 'continue': if (!loadSaved()) toast('No save found', 'bad'); break;
    case 'recruit': { const r = S.cmdRecruit(m, +d.p, d.t); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'build': { const r = S.cmdBuild(m, +d.p, d.k); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'research': { const r = S.cmdResearch(m, d.k); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'cancelresearch': { const r = S.cmdCancelResearch(m); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'cancelbuild': { const r = S.cmdCancelBuild(m, +d.p); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'selarmy': selectArmy(+d.a); break;
    case 'selprov': selectProv(+d.p); break;
    case 'stop': S.cmdStop(+d.a); toast('Halting at the next stop', 'ok'); dirty(); break;
    case 'split': { const r = S.cmdSplit(+d.a, d.k); toast(r.msg, r.ok ? 'ok' : 'bad'); if (r.ok) { UI.selA = r.id; } dirty(); break; }
    case 'merge': { const r = S.cmdMerge(m, +d.p, d.k); toast(r.msg, r.ok ? 'ok' : 'bad'); if (r.ok) UI.selA = r.id; dirty(); break; }
    case 'disband': S.cmdDisband(+d.a); UI.selA = null; toast('Army disbanded', 'ok'); dirty(); break;
    case 'homefocus': { const c = nat(m).capital; selectProv(c); focusOn(c, 1.8); break; }
    case 'focusnat': focusNation(+d.n); break;
    case 'dipopen': {
      UI.dipOpen = UI.dipOpen === +d.n && UI.tab === 'dip' ? null : +d.n; UI.dipMsg = ''; UI.confirm = '';
      if (UI.tab !== 'dip') setTab('dip');
      dirty(); break;
    }
    case 'dip': doDip(d.v, +d.n, d.x !== undefined ? (isNaN(+d.x) ? d.x : +d.x) : undefined); break;
    case 'arm': UI.confirm = d.k; dirty(); break;
    case 'war': doDip('war', +d.n); break;
    case 'pyes': { const r = S.answerProposal(+d.id, true); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'pno': { const r = S.answerProposal(+d.id, false); toast(r.msg, 'info'); dirty(); break; }
    case 'save': saveNow(); break;
    case 'newgame': saveNow(true); UI.started = true; showStart(); break;
    case 'keep': closeModal(); break;
    case 'watch': G().opts.player = -1; closeModal(); dirty(); break;
    case 'finish': closeModal(); setTab('intel'); break;
  }
  flush();
});
document.addEventListener('keydown', e => {
  if (!UI.started || UI.modal) return;
  if (e.key === ' ') { e.preventDefault(); setSpeed(UI.speed === 0 ? 1 : 0); }
  else if (e.key === '1') setSpeed(1); else if (e.key === '2') setSpeed(4); else if (e.key === '3') setSpeed(16);
  else if (e.key === 'Escape') { UI.selA = null; UI.selP = null; dirty(); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('.row')) e.target.click();
});

// ------------------------------------------------------------ frame loop
let last = performance.now(), lastWall = Date.now(), acc = 0, uiClock = 0, saveClock = 0, lastDraw = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  const wall = Date.now(), gap = wall - lastWall; lastWall = wall;
  if (UI.started && G()) {
    // the tab was hidden or the device slept: let the world catch up
    if (gap > 4000 && UI.speed > 0 && !UI.modal) catchUp(gap);
    if (UI.speed > 0 && !UI.modal) {
      acc += dt * UI.speed * pace();
      let n = 0;
      while (acc >= 0.25 && n < 40) { S.step(0.25); acc -= 0.25; n++; }
      if (n === 40) acc = 0;
      else if (acc > 0) { S.step(acc); acc = 0; }   // slow paces advance a sliver every frame so movement stays smooth
    }
    if (now - lastDraw >= 33) { lastDraw = now; drawMap(now); }
    uiClock += dt; saveClock += dt;
    if (uiClock > 0.25) { uiClock = 0; tickUI(); }
    if (saveClock > 20) { saveClock = 0; if (!UI.modal) saveNow(true); }
  }
  requestAnimationFrame(frame);
}
function tickUI() {
  const g = G();
  renderHeader();
  for (const e of g.log) {
    if (e.s <= UI.lastSeq) continue;
    UI.lastSeq = e.s;
    if (e.me || e.kind === 'elim' || e.kind === 'revolt') toast(e.txt, e.kind);
  }
  if (g.flags.dominanceAsk && !UI.modal) {
    g.flags.dominanceAsk = false;
    modal(`<div class="title">Dominance</div><p class="lede">Your nation now holds more than 60% of the population. You can stop here and look at the standings, or keep going. The world will not let you rest: neighbours form coalitions, conquered provinces revolt, and rivals rebuild.</p><div class="btns"><button class="btn pri" data-act="keep">Keep playing</button><button class="btn" data-act="finish">See standings</button></div>`);
  }
  if (g.flags.playerDead && !UI.modal) {
    g.flags.playerDead = false;
    modal(`<div class="title">Fallen</div><p class="lede">${nat(g.opts.player).name} has been eliminated. You can keep watching the war play out, or start again.</p><div class="btns"><button class="btn pri" data-act="watch">Keep watching</button><button class="btn" data-act="newgame">New game</button></div>`);
  }
  if (!UI.modal) {
    if (dirtyFlag || (UI.sig !== panelSig())) { if (!pts.size && performance.now() - UI.touch > 700) { dirtyFlag = false; renderPanel(); } }
    else updateBinds();
  }
}

// ------------------------------------------------------------ boot
new ResizeObserver(() => {
  const r = stage.getBoundingClientRect();
  UI.W = r.width; UI.H = r.height;
  if (!UI.W || !UI.H) return;
  if (!UI.viewInit) { UI.viewInit = true; fitView(); if (UI.started && G() && me() >= 0) focusNation(me()); }
  else applyView();
}).observe(stage);

function boot(data) {
  data = data || {};
  buildMap();
  requestAnimationFrame(frame);
  if (data.save) { try { S.load(data.save); afterStart(); if (data.ui) { UI.speed = data.ui.speed === undefined ? 1 : data.ui.speed; setSpeed(UI.speed); } return; } catch (_) {} }
  showStart();
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ save: UI.started && G() ? S.serialize() : null, ui: { speed: UI.speed } })); } catch (_) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
document.addEventListener('visibilitychange', () => { if (document.hidden && UI.started && G() && !UI.modal) saveNow(true); });
window.__flusa = { UI, S, drawMap, renderPanel, catchUp, fmtDur };
})();

</script>
