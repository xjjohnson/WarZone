<title>Frontline USA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept: a drafting-table war room. Blueprint sea with a survey grid, nations as flat colour plates,
   a thin instrument bar on top, a sheet of orders at the bottom, and tabs that read like drawer labels. */
:root {
  --bg: #E8EEF5; --paper: #F5F8FC; --paper2: #DCE6F1; --ink: #0E2747; --ink2: #546A88;
  --line: #B3C4D9; --grid: #CBD8E8; --sea: #D6E2F0; --stroke: #E8EEF5;
  --warn: #C8371B; --good: #13804F; --hot: #A85A00; --sel: #0E2747; --badge-ink: #0A1C30;
  --display: 'Big Shoulders Display', 'Arial Narrow', 'Helvetica Neue', sans-serif;
  --body: 'Barlow Semi Condensed', 'Arial Narrow', system-ui, sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --gl: max(16px, env(safe-area-inset-left, 0px));
  --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07182B; --paper: #0D2440; --paper2: #12304F; --ink: #E6F0FB; --ink2: #8CA6C4;
    --line: #26486D; --grid: #10304F; --sea: #091E36; --stroke: #091E36;
    --warn: #FF7455; --good: #46D69B; --hot: #FFB547; --sel: #FFFFFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07182B; --paper: #0D2440; --paper2: #12304F; --ink: #E6F0FB; --ink2: #8CA6C4;
  --line: #26486D; --grid: #10304F; --sea: #091E36; --stroke: #091E36;
  --warn: #FF7455; --good: #46D69B; --hot: #FFB547; --sel: #FFFFFF; color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.35 var(--body); overflow: hidden; }
button { font: inherit; color: inherit; }
b, strong { font-weight: 600; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

#app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; min-width: 0; }
#top, #res { padding-left: var(--gl); padding-right: var(--gr); }
#top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 6px; border-bottom: 1px solid var(--line); background: var(--paper); }
.who { display: flex; align-items: baseline; gap: 8px; min-width: 0; flex: 1; }
.who b { font: 800 21px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; flex: none; }
.who i { width: 10px; height: 10px; border: 1px solid var(--ink); align-self: center; flex: none; }
#clock { color: var(--ink2); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.speed { display: flex; border: 1px solid var(--line); flex: none; }
.speed button { background: none; border: 0; border-right: 1px solid var(--line); padding: 5px 9px; min-width: 36px; min-height: 32px; font: 600 12px var(--mono); cursor: pointer; }
.speed button:last-child { border-right: 0; }
.speed button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
#res { display: flex; gap: 11px; padding-block: 5px; border-bottom: 1px solid var(--line); background: var(--paper2); overflow-x: auto; scrollbar-width: none; }
#res::-webkit-scrollbar { display: none; }
.rs { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; flex: none; }
.rs small { font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.rs b { font: 600 14px var(--mono); }
.rs em { font: 500 11px var(--mono); font-style: normal; }
.up { color: var(--good); } .down { color: var(--warn); }

#stage { position: relative; overflow: hidden; background: var(--sea); min-height: 0; }
#map { width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; }
.prov { stroke: var(--stroke); stroke-width: .7; fill-opacity: .88; cursor: pointer; }
.bd { fill: none; stroke: var(--stroke); stroke-width: .5; opacity: .55; pointer-events: none; }
.bd.nat { stroke: var(--ink); stroke-width: 1.5; opacity: .85; }
.coast { fill: none; stroke: var(--ink); stroke-width: 1; opacity: .5; pointer-events: none; }
.sealane { fill: none; stroke: var(--ink2); stroke-dasharray: 3 5; stroke-width: 1; pointer-events: none; opacity: .8; }
.lab { font-family: var(--mono); font-weight: 600; fill: var(--badge-ink); text-anchor: middle; pointer-events: none; paint-order: stroke; stroke: rgba(255,255,255,.35); stroke-width: 2px; }
.capdot { fill: none; stroke: var(--badge-ink); stroke-width: 1.4; pointer-events: none; }
.hit { fill: transparent; }
.selout { fill: none; stroke: var(--sel); stroke-width: 2.4; pointer-events: none; }
.route { fill: none; stroke: var(--sel); stroke-width: 1.8; stroke-dasharray: 5 4; pointer-events: none; }
.route.faint { stroke-width: 1.2; opacity: .45; }
.bdg rect { stroke: var(--badge-ink); stroke-width: 1; }
.bdg text { font: 700 9px var(--mono); fill: var(--badge-ink); text-anchor: middle; pointer-events: none; }
.bdg .dir { fill: var(--badge-ink); }
.bdg.sel rect { stroke: var(--sel); stroke-width: 2.4; }
.bdg.foe rect { stroke-dasharray: 0; }
.fxr { fill: none; stroke-width: 2; pointer-events: none; }
.mapctl { position: absolute; right: max(10px, env(safe-area-inset-right, 0px)); top: 10px; display: flex; flex-direction: column; border: 1px solid var(--line); background: var(--paper); }
.mapctl button { width: 36px; height: 36px; border: 0; border-bottom: 1px solid var(--line); background: none; font: 600 17px var(--mono); cursor: pointer; }
.mapctl button:last-child { border-bottom: 0; font-size: 11px; }
#toasts { position: absolute; left: max(10px, env(safe-area-inset-left, 0px)); top: 10px; right: 58px; display: flex; flex-direction: column; gap: 5px; pointer-events: none; }
.toast { background: var(--paper); border: 1px solid var(--line); border-left: 4px solid var(--ink2); padding: 6px 9px; font-size: 13px; max-width: 420px; box-shadow: 0 2px 8px rgba(0,0,0,.18); }
.toast.war, .toast.bad { border-left-color: var(--warn); } .toast.ok, .toast.peace, .toast.treaty { border-left-color: var(--good); }
.toast.capture { border-left-color: var(--hot); } .toast.proposal { border-left-color: #4C8DF2; } .toast.elim, .toast.revolt { border-left-color: #9B7DE8; }

#side { display: flex; flex-direction: column; min-height: 0; max-height: 42vh; border-top: 2px solid var(--ink); background: var(--paper); }
#side[data-tab="forces"], #side[data-tab="dip"], #side[data-tab="intel"] { max-height: 62vh; }
#side.collapsed #sheet { display: none; }
#sheet { overflow-y: auto; overscroll-behavior: contain; padding: 10px var(--gr) 12px var(--gl); flex: 1; min-height: 0; }
#tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid var(--line); background: var(--paper2); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
#tabs button { background: none; border: 0; border-top: 3px solid transparent; padding: 8px 4px 9px; font: 800 15px var(--display); letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); cursor: pointer; position: relative; min-height: 40px; }
#tabs button[aria-selected="true"] { color: var(--ink); border-top-color: var(--ink); background: var(--paper); }
#tabs .badge { position: absolute; top: 3px; right: 4px; min-width: 17px; height: 17px; border-radius: 9px; background: var(--warn); color: #fff; font: 700 11px/17px var(--mono); text-align: center; padding: 0 4px; }

h3 { margin: 0; font: 800 22px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; }
h4 { margin: 14px 0 6px; font: 600 10.5px var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink2); }
h4:first-child { margin-top: 0; }
.hd { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; flex-wrap: wrap; }
.hd small { font: 500 12px var(--mono); color: var(--ink2); }
.dot { display: inline-block; width: 11px; height: 11px; border: 1px solid var(--ink); vertical-align: -1px; flex: none; }
.tag { display: inline-block; padding: 1px 6px; border: 1px solid var(--line); font: 600 10.5px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); }
.tag.war { color: var(--warn); border-color: var(--warn); } .tag.good { color: var(--good); border-color: var(--good); } .tag.hot { color: var(--hot); border-color: var(--hot); }
.kvs { display: grid; grid-template-columns: repeat(auto-fit, minmax(98px, 1fr)); gap: 6px 14px; margin: 6px 0 4px; }
.kv span { display: block; font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
.kv b { font: 500 14px var(--mono); }
.bar { height: 5px; background: var(--paper2); border: 1px solid var(--line); margin-top: 3px; }
.bar i { display: block; height: 100%; background: var(--ink); }
.bar.warn i { background: var(--warn); }
.btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.btn { background: var(--paper); border: 1px solid var(--ink); color: var(--ink); padding: 6px 11px; min-height: 36px; font: 600 13px var(--body); cursor: pointer; border-radius: 2px; text-align: left; line-height: 1.15; }
.btn small { display: block; font: 500 10.5px var(--mono); color: var(--ink2); margin-top: 2px; }
.btn.pri { background: var(--ink); color: var(--bg); } .btn.pri small { color: inherit; opacity: .75; }
.btn.warn { color: var(--warn); border-color: var(--warn); }
.btn.dim { opacity: .5; }
.btn:focus-visible, .speed button:focus-visible, #tabs button:focus-visible, .mapctl button:focus-visible, .row:focus-visible { outline: 2px solid var(--hot); outline-offset: 1px; }
.row { display: flex; align-items: center; gap: 9px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; min-width: 0; }
.row > .grow { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; }
.row .sub { color: var(--ink2); font-size: 12.5px; overflow-wrap: anywhere; }
.row .num { font: 500 13px var(--mono); text-align: right; flex: none; }
.pill { display: inline-block; margin: 0 4px 0 0; padding: 0 5px; font: 700 10px/16px var(--mono); border: 1px solid currentColor; vertical-align: 1px; }
.note { color: var(--ink2); font-size: 13px; margin: 6px 0; }
.msg { margin: 8px 0; padding: 7px 9px; border-left: 3px solid var(--hot); background: var(--paper2); font-size: 13px; }
.logl { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px dotted var(--line); font-size: 13px; }
.logl time { font: 500 11px var(--mono); color: var(--ink2); flex: none; width: 44px; padding-top: 2px; }
.logl.war { color: var(--warn); } .logl.capture { color: var(--hot); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
td, th { padding: 5px 4px; border-bottom: 1px solid var(--line); text-align: right; }
th { font: 600 10px var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--ink2); }
td:first-child, th:first-child { text-align: left; }
td.mono { font-size: 12.5px; }
details summary { cursor: pointer; font-weight: 600; padding: 6px 0; }
details p { margin: 4px 0 8px; color: var(--ink2); }
.opn { font: 500 12.5px var(--mono); }
.part { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 1px 0; }
.part b { font: 500 12.5px var(--mono); }

#modal { position: fixed; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: max(18px, env(safe-area-inset-top, 0px)) var(--gr) max(18px, env(safe-area-inset-bottom, 0px)) var(--gl); }
#modal[hidden] { display: none; }
.mwrap { max-width: 760px; margin: 0 auto; }
.title { font: 800 clamp(40px, 11vw, 74px)/.9 var(--display); letter-spacing: .04em; text-transform: uppercase; margin: 6px 0 6px; }
.lede { color: var(--ink2); max-width: 46ch; margin: 0 0 14px; font-size: 15px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; margin: 10px 0 16px; }
.nc { text-align: left; background: var(--paper); border: 1px solid var(--line); padding: 0; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.nc:hover, .nc:focus-visible { border-color: var(--ink); outline: none; }
.nc .strip { height: 8px; }
.nc .in { padding: 8px 10px 10px; }
.nc b { display: block; font: 800 17px/1.05 var(--display); letter-spacing: .05em; text-transform: uppercase; }
.nc span { display: block; font-size: 12px; color: var(--ink2); margin-top: 3px; }
.nc .st { font: 500 11.5px var(--mono); color: var(--ink); margin-top: 6px; }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { background: none; border: 0; border-right: 1px solid var(--ink); padding: 7px 13px; font: 600 13px var(--body); cursor: pointer; min-height: 36px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.opts { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin: 6px 0 4px; }

@media (min-width: 920px) {
  #app { grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: auto auto minmax(0, 1fr); }
  #top, #res { grid-column: 1 / -1; }
  #side { grid-column: 2; grid-row: 3; max-height: none !important; border-top: 0; border-left: 2px solid var(--ink); }
  #stage { grid-column: 1; grid-row: 3; }
  #side { flex-direction: column-reverse; }
  #side.collapsed #sheet { display: block; }
  #tabs { border-top: 0; border-bottom: 1px solid var(--line); }
  #tabs button { border-top: 0; border-bottom: 3px solid transparent; }
  #tabs button[aria-selected="true"] { border-bottom-color: var(--ink); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

  <header id="top">
    <div class="who"><i id="whoDot"></i><b id="whoName">Frontline USA</b><span id="clock" class="mono"></span></div>
    <div class="speed" role="group" aria-label="Game speed">
      <button data-act="speed" data-v="0" aria-label="Pause" aria-pressed="false">II</button>
      <button data-act="speed" data-v="1" aria-pressed="true">1&times;</button>
      <button data-act="speed" data-v="2" aria-pressed="false">2&times;</button>
      <button data-act="speed" data-v="4" aria-pressed="false">4&times;</button>
    </div>

  <div id="res" class="mono"></div>
  <main id="stage">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Map of the United States divided into provinces"></svg>

  </main>

      <button role="tab" data-act="tab" data-v="forces" aria-selected="false">Forces</button>

      <button role="tab" data-act="tab" data-v="intel" aria-selected="false">Intel</button>
    </nav>
  </aside>
</div>
<div id="modal" hidden></div>

// ---------------------------------------------------------------- derived cache
function refresh() {

  }
  for (const a of G.armies) {

    if (a.at != null) (d.armyAt[a.at] = d.armyAt[a.at] || []).push(a);

// ---------------------------------------------------------------- economy
function computeRates() {
  const diff = G.opts.diff === 'hard' ? 1.2 : G.opts.diff === 'easy' ? 0.85 : 1;
  for (const n of G.nations) {
    if (!n.alive) { n.rate = { c: 0, s: 0, f: 0, up: 0, net: 0 }; continue; }
    let c = 0, s = 0, f = 0;
    for (const pid of D.owned[n.id]) {
      const p = G.provs[pid], d = PS[pid];
      const m = (1 + 0.25 * p.infra) * (1 - 0.6 * p.unrest) * (n.capital === pid ? 1.25 : 1) * (p.cap ? 0.5 : 1);
      c += d.cash * m; s += d.steel * m; f += d.fuel * m;
    }
    let trade = 0;
    for (const t of G.treaties) if (t.type === 'trade' && (t.a === n.id || t.b === n.id)) trade += 0.07;
    c *= 1 + Math.min(0.21, trade);
    const mul = n.player ? 1 : diff;
    c *= mul; s *= mul; f *= mul;
    let up = 0;
    for (const a of D.armiesBy[n.id]) for (const t of UT) up += a.u[t] * UNITS[t].upk;
    for (const pid of D.owned[n.id]) for (const it of G.provs[pid].q) up += 0; // queued units cost nothing until built
    n.rate = { c, s, f, up, net: c - up };
  }
}
function provRates(pid) {
  const p = G.provs[pid], d = PS[pid], n = G.nations[p.owner];
  const m = (1 + 0.25 * p.infra) * (1 - 0.6 * p.unrest) * (n.capital === pid ? 1.25 : 1) * (p.cap ? 0.5 : 1);
  return { c: d.cash * m, s: d.steel * m, f: d.fuel * m };
}
function econTick(dt) {

    n.cash += n.rate.net * dt; n.steel += n.rate.s * dt; n.fuel += n.rate.f * dt;
    if (n.cash < 0) {

}
const canPay = (n, c) => n.cash >= c.c && n.steel >= c.st && n.fuel >= c.f;
const pay = (n, c) => { n.cash -= c.c; n.steel -= c.st; n.fuel -= c.f; };

const buildCost = (kind, lvl) => kind === 'fort'
  ? { c: 60 * (lvl + 1), st: 25 * (lvl + 1), f: 0 }
  : { c: 90 * (lvl + 1), st: 15 * (lvl + 1), f: 0 };

function prodTick(dt) {
  for (const p of G.provs) {

    if (p.cap || p.battle) continue;       // no training under siege
    const it = p.q[0];
    it.left -= dt;

}
function newArmy(owner, at) {

// ---------------------------------------------------------------- movement
function edgeTime(i, j, speed) { return (EDGE[i * 100 + j] || 100) / speed; }

function findRoute(nat, from, to, speed) {
  if (from === to) return [];
  const dist = new Array(NP).fill(Infinity), prev = new Array(NP).fill(-1), done = new Array(NP).fill(false);
  dist[from] = 0;
  for (let it = 0; it < NP; it++) {
    let u = -1, best = Infinity;
    for (let i = 0; i < NP; i++) if (!done[i] && dist[i] < best) { best = dist[i]; u = i; }
    if (u < 0 || u === to) break;
    done[u] = true;
    for (const v of PS[u].nbrs) {
      if (done[v] || !canEnter(nat, v)) continue;
      const hostile = G.provs[v].owner !== nat && atWar(nat, G.provs[v].owner);
      const w = edgeTime(u, v, speed) + (hostile && v !== to ? 14 : 0);
      if (dist[u] + w < dist[v]) { dist[v] = dist[u] + w; prev[v] = u; }
    }

  const r = []; let c = to;
  while (c !== from) { r.unshift(c); c = prev[c]; }
  return r;

  const sp = armySpeed(a); let t = 0, cur = startPid;
  for (const r of route) { t += edgeTime(cur, r, sp); cur = r; }
  return t;
}
function orderMove(a, dest) {
  const sp = armySpeed(a);
  if (!a.mv) {
    if (a.at === dest) { a.route = []; return { ok: true, msg: 'Holding position' }; }
    const r = findRoute(a.owner, a.at, dest, sp);
    if (!r) return { ok: false, msg: 'No permitted route. Declare war or get passage rights first.' };
    a.route = r; startNext(a);
    return { ok: true, msg: 'Moving out', eta: routeTime(a, r, a.at) };
  }
  // already on the road: either carry on to the next stop, or turn around
  const fwdRoute = findRoute(a.owner, a.mv.to, dest, sp) || (a.mv.to === dest ? [] : null);
  const fwdCost = a.mv.dur - a.mv.t + (fwdRoute ? routeTime(a, fwdRoute, a.mv.to) : Infinity);
  let backRoute = null, backCost = Infinity;
  if (canEnter(a.owner, a.mv.from)) {
    backRoute = a.mv.from === dest ? [] : findRoute(a.owner, a.mv.from, dest, sp);
    if (backRoute) backCost = a.mv.t + routeTime(a, backRoute, a.mv.from);
  }
  if (fwdCost === Infinity && backCost === Infinity) return { ok: false, msg: 'No permitted route.' };
  if (backCost < fwdCost) {
    const { from, to, t, dur } = a.mv;
    a.mv = { from: to, to: from, t: dur - t, dur };
    a.route = backRoute;
    return { ok: true, msg: 'Turning back', eta: backCost };
  }
  a.route = fwdRoute;
  return { ok: true, msg: 'Redirected', eta: fwdCost };
}

  const next = a.route.shift();

  if (!canEnter(a.owner, next)) { a.route = []; return; }
  a.mv = { from: a.at, to: next, t: 0, dur: edgeTime(a.at, next, armySpeed(a)) };
  a.at = null;
}
function hostileHere(nat, pid) {
  const p = G.provs[pid];
  if (atWar(nat, p.owner) && p.garrison > 0.3) return true;
  for (const x of G.armies) if (x.at === pid && x.owner !== nat && atWar(nat, x.owner)) return true;
  return false;
}
function moveTick(dt) {
  for (const a of G.armies) {
    if (!a.mv) continue;
    a.mv.t += dt;
    if (a.mv.t >= a.mv.dur) {
      a.at = a.mv.to; a.mv = null;
      if (hostileHere(a.owner, a.at)) a.route = [];         // engaged: stop and fight
      else if (a.route.length) startNext(a);
    }
  }
}

function enforceBorders() {

    if (a.at == null) continue;
    if (canEnter(a.owner, a.at)) continue;
    // nearest tile we may stand on
    const seen = new Set([a.at]); let frontier = [[a.at, []]], dest = null;
    while (frontier.length && !dest) {
      const nxt = [];
      for (const [u, path] of frontier) for (const v of PS[u].nbrs) {
        if (seen.has(v)) continue; seen.add(v);
        const o = G.provs[v].owner;
        if (o === a.owner || hasAccess(a.owner, o)) { dest = path.concat([v]); break; }
        nxt.push([v, path.concat([v])]);
      }

// ---------------------------------------------------------------- combat
function sizeOf(f) { let s = 0; for (const t of UT) s += f.u[t] * TW[t]; return s; }
function roundForces(forces, dt, noise) {
  const dmg = forces.map(() => emptyU());
  const sizes = forces.map(sizeOf);
  for (let i = 0; i < forces.length; i++) {
    const f = forces[i];
    if (sizes[i] <= 0.01) continue;
    let tot = 0; const foes = [];
    for (let j = 0; j < forces.length; j++) if (j !== i && sizes[j] > 0.01 && atWar(f.nat, forces[j].nat)) { foes.push(j); tot += sizes[j]; }
    if (!foes.length) continue;
    for (const at of UT) {
      const c = f.u[at]; if (c <= 0) continue;
      const base = c * UNITS[at].atk * K_DMG * dt * (noise ? rnd(0.88, 1.12) : 1) * (f.gar ? 0.8 : 1);
      for (const j of foes) {
        const e = forces[j], share = sizes[j] / tot;
        for (const dt2 of UT) {
          if (e.u[dt2] <= 0) continue;
          const tsh = e.u[dt2] * TW[dt2] / sizes[j];
          const bonus = (e.db || 0) * (at === 'art' ? 0.5 : 1);
          dmg[j][dt2] += base * share * tsh * MULT[at][dt2] / (1 + bonus);

  }
  for (let i = 0; i < forces.length; i++) for (const t of UT) {
    forces[i].u[t] = Math.max(0, forces[i].u[t] - dmg[i][t] / UNITS[t].hp);
    if (forces[i].u[t] < 0.02) forces[i].u[t] = 0;

function forcesIn(pid, clone) {

  for (const a of G.armies) {

    roundForces(forces, 1, false);
    const a = forces.find(f => f.att);
    const dLeft = hostileDef.reduce((s, f) => s + unitCount(f.u), 0);
    if (unitCount(a.u) < 0.3 || dLeft < 0.3) break;
  }
  const a = forces.find(f => f.att);
  const left = hostileDef.reduce((s, f) => s + unitCount(f.u), 0);
  return { win: left < 0.3 && unitCount(a.u) > 0.3, keep: unitCount(a.u) / startA, defLeft: left / defStart };
}

function processBattles() {
  for (const p of G.provs) {
    const here = [];
    for (const a of G.armies) if (a.at === p.id) here.push(a);
    let hostile = false;
    const nats = new Set(here.map(a => a.owner));
    if (p.garrison > 0.05) nats.add(p.owner);
    const list = [...nats];
    for (let i = 0; i < list.length && !hostile; i++) for (let j = i + 1; j < list.length; j++) if (atWar(list[i], list[j])) { hostile = true; break; }
    p.battle = hostile;
    if (hostile) {
      const forces = forcesIn(p.id, false);
      const gf = forces.find(f => f.gar);
      let gu = null;
      if (gf) { gu = { inf: p.garrison, art: 0, arm: 0, air: 0 }; gf.u = gu; }
      const before = new Map(forces.filter(f => f.ref && !f.gar).map(f => [f.ref, unitCount(f.u)]));
      roundForces(forces, 1, true);
      if (gu) p.garrison = gu.inf;
      for (const f of forces) if (f.ref && !f.gar) {
        const a = f.ref;
        const lost = (before.get(a) || 0) - unitCount(a.u);
        if (lost > 0) G.nations[a.owner].lost = (G.nations[a.owner].lost || 0) + lost;
        if (unitCount(a.u) < 0.4) { G.armies = G.armies.filter(x => x !== a); }
      }
      p.lastBattle = G.t;
    } else if (p.garrison < maxGar(p)) {
      const enemyPresent = here.some(a => atWar(a.owner, p.owner));
      if (!enemyPresent) p.garrison = Math.min(maxGar(p), p.garrison + 0.05 + 0.015 * p.fort);
    }
    // occupation
    const present = G.armies.filter(a => a.at === p.id);
    const ownerSide = present.some(a => a.owner === p.owner || allied(a.owner, p.owner));
    const occ = present.filter(a => atWar(a.owner, p.owner));
    if (occ.length && !ownerSide && p.garrison < 0.3) {
      let best = occ[0];
      for (const a of occ) if (unitPow(a.u) > unitPow(best.u)) best = a;
      const by = best.owner;
      if (p.cap && p.cap.by === by) p.cap.p += 1 / CAPTURE_T; else p.cap = { by, p: 1 / CAPTURE_T };
      if (p.cap.p >= 1) capture(p, by);
    } else if (p.cap) {
      p.cap.p -= 0.12;
      if (p.cap.p <= 0) p.cap = null;
    }
  }
}

function capture(p, by) {
  const old = p.owner, O = G.nations[old], B = G.nations[by];
  const wasCap = O.capital === p.id;
  p.owner = by; p.garrison = 0.5; p.cap = null;
  p.fort = Math.max(0, p.fort - 1); p.infra = Math.max(0, p.infra - 1);

  const d = PS[p.id];
  B.cash += 40 + d.pop * 6; B.steel += d.steel * 40; B.fuel += d.fuel * 40;
  const k = key(old, by);
  const ws = G.wstat[k] || (G.wstat[k] = { caps: {}, last: G.t });
  ws.caps[by] = (ws.caps[by] || 0) + 1; ws.last = G.t;
  B.taken = (B.taken || 0) + 1;
  log(`${B.short} captured ${d.name} from ${O.short}`, 'capture', { pid: p.id, nats: [by, old] });
  if (wasCap) {
    const rest = G.provs.filter(q => q.owner === old).sort((a, b) => PS[b.id].pop - PS[a.id].pop);
    if (rest.length) { O.capital = rest[0].id; log(`${O.short} moves its capital to ${PS[rest[0].id].name}`, 'info', { nats: [old] }); }

}
function eliminate(id, by) {

  G.treaties = G.treaties.filter(t => t.a !== id && t.b !== id);
  for (const k of Object.keys(G.wars)) { const [x, y] = k.split('-').map(Number); if (x === id || y === id) delete G.wars[k]; }

}

// ---------------------------------------------------------------- unrest and uprisings
function unrestTick() {
  for (const n of G.nations) {
    if (!n.alive) continue;
    const owned = D.owned[n.id];
    let foreign = 0;
    for (const pid of owned) if (G.provs[pid].orig !== n.id) foreign++;
    const over = foreign / Math.max(3, owned.length - foreign);      // conquests vs core
    for (const pid of owned) {
      const p = G.provs[pid];
      const garrisoned = G.armies.some(a => a.at === pid && a.owner === n.id);
      if (p.orig === n.id) { p.unrest = Math.max(0, p.unrest - 0.006 - (garrisoned ? 0.01 : 0)); continue; }
      let d = 0.0014 * (over - 0.35) - (garrisoned ? 0.011 : 0) - (p.fort * 0.002) - 0.0012;
      if (!garrisoned && p.garrison < 1) d += 0.001;
      p.unrest = clamp(p.unrest + d, 0, 1);
      if (p.unrest >= 1 && !garrisoned) revolt(p);
    }
  }
}
function revolt(p) {
  const old = G.nations[p.owner], d = PS[p.id];
  const origin = G.nations[p.orig];
  p.unrest = 0.3; p.q = [];
  if (origin && origin.alive && origin.id !== p.owner) {
    p.owner = origin.id; p.garrison = 2;
    log(`${d.name} rises up against ${old.short} and returns to ${origin.short}`, 'revolt', { pid: p.id, nats: [old.id, origin.id] });
  } else {
    const id = G.nations.length;
    const keys = Object.keys(PERS);
    const hue = Math.floor(rnd(0, 360));
    G.nations.push({ id, name: 'Free State of ' + d.name, short: 'Free ' + d.abbr, color: `hsl(${hue} 55% 62%)`, pers: keys[Math.floor(rnd(0, keys.length))],
      player: false, alive: true, capital: p.id, cash: 150, steel: 40, fuel: 30, infamy: 0, rate: { c: 0, s: 0, f: 0, up: 0, net: 0 },
      ai: { next: G.t + 3, focus: null, tprop: {}, lastWar: G.t }, orig: id });
    p.owner = id; p.orig = id; p.garrison = 3;
    const a = newArmy(id, p.id); a.u.inf = 4;
    log(`${d.name} declares independence from ${old.short}`, 'revolt', { pid: p.id, nats: [old.id, id] });
    if (!atWar(id, old.id)) G.wars[key(id, old.id)] = G.t;
  }
  refresh();
  if (!G.provs.some(q => q.owner === old.id)) eliminate(old.id, p.owner);
}

// ---------------------------------------------------------------- diplomacy
function warStat(a, b) {
  const k = key(a, b), ws = G.wstat[k] || { caps: {}, last: 0 };
  return { dur: G.wars[k] !== undefined ? G.t - G.wars[k] : 0, a: ws.caps[a] || 0, b: ws.caps[b] || 0, last: ws.last || G.wars[k] || 0 };
}
function declareWar(a, b, why) {
  if (a === b || !G.nations[a].alive || !G.nations[b].alive) return { ok: false, msg: 'Invalid target' };
  if (atWar(a, b)) return { ok: false, msg: 'Already at war' };
  const tl = truceLeft(a, b);
  if (tl > 0) return { ok: false, msg: `A truce holds for another ${Math.ceil(tl)}s` };
  const A = G.nations[a], B = G.nations[b];
  let broke = false;
  if (allied(a, b)) {
    broke = true; A.infamy = Math.min(100, A.infamy + 30);
    removeTreaties(a, b, ['alliance']);
    remember(b, a, 'Betrayed our alliance', -60, 900, 100);
    for (const c of G.nations) if (c.alive && c.id !== a && c.id !== b) remember(c.id, a, 'Broke an alliance', -12, 700, 40);
  } else if (hasTreaty(a, b, 'nap')) {
    broke = true; A.infamy = Math.min(100, A.infamy + 15);
    removeTreaties(a, b, ['nap']);
    remember(b, a, 'Broke our non-aggression pact', -40, 700, 80);
    for (const c of G.nations) if (c.alive && c.id !== a && c.id !== b) remember(c.id, a, 'Breaks treaties', -6, 600, 30);
  }
  removeTreaties(a, b, ['access', 'trade', 'nap']);
  G.wars[key(a, b)] = G.t;
  G.wstat[key(a, b)] = { caps: {}, last: G.t };
  remember(b, a, 'Declared war on us', -35, 500, 80);
  log(`${A.short} declared war on ${B.short}${broke ? ' (breaking a treaty)' : ''}`, 'war', { nats: [a, b] });
  // allies pile in
  for (const x of G.nations) {
    if (!x.alive || x.id === a || x.id === b) continue;
    const defenderAlly = allied(x.id, b) && !allied(x.id, a);
    const attackerAlly = allied(x.id, a) && !allied(x.id, b);
    if (!defenderAlly && !attackerAlly) continue;
    const target = defenderAlly ? a : b, friend = defenderAlly ? b : a;
    if (atWar(x.id, target) || truceLeft(x.id, target) > 0) continue;
    if (x.player) {
      propose(friend, x.id, 'joinwar', `${G.nations[friend].short} asks you to join the war against ${G.nations[target].short}.`, { target }, 60);
    } else {
      const op = opinion(x.id, friend).total;
      const willing = op >= 25 && enemiesOf(x.id).length < 2 && D.power[x.id] > D.power[target] * 0.35 && Math.random() < (defenderAlly ? 0.7 : 0.45);
      if (willing) declareWar(x.id, target, 'ally');
    }
  }
  enforceBorders();
  return { ok: true, msg: `War declared on ${B.short}` };
}
function makePeace(a, b) {
  delete G.wars[key(a, b)];
  removeTreaties(a, b, ['truce']);
  addTreaty('truce', a, b, 150);
  remember(a, b, 'Ended the war', 8, 300, 20); remember(b, a, 'Ended the war', 8, 300, 20);
  log(`${G.nations[a].short} and ${G.nations[b].short} agreed a ceasefire`, 'peace', { nats: [a, b] });
  G.nations[a].ai.lastWar = G.t; G.nations[b].ai.lastWar = G.t;
  enforceBorders();
}

// How would nation r answer a proposal from nation p?
function evalProposal(kind, r, p, extra) {
  const R = G.nations[r], P = pers(R), op = opinion(r, p).total;
  const no = m => ({ ok: false, msg: m }), yes = m => ({ ok: true, msg: m || 'Agreed' });
  if (atWar(r, p) && kind !== 'ceasefire') return no('We are at war with you.');
  const pw = D.power[p] / Math.max(1, D.power[r]);
  switch (kind) {
    case 'ceasefire': {
      if (!atWar(r, p)) return no('We are not at war.');
      const ws = warStat(r, p), ratio = 1 / pw;
      let sc = (1 - ratio) * 1.6 + clamp(ws.dur / 500, 0, 1.2) - (ws.a - ws.b) * 0.25 + (G.t - ws.last > 150 ? 0.4 : 0) - (P.aggr - 1) * 0.5;
      if (D.share[p] > 0.4 && p !== r) sc -= 0.4;
      if (ws.dur < 40) sc -= 0.8;
      return sc > 0.55 ? yes('Peace, for now.') : no(ratio > 1 ? 'We believe we are winning this war.' : 'The war goes on. We are not ready to stop.');
    }
    case 'nap': {
      if (hasTreaty(r, p, 'nap') || allied(r, p)) return no('Already covered by a treaty.');
      if (R.ai.warTarget === p) return no('We have other plans for you.');
      return op >= 6 - P.diplo * 8 ? yes() : no('We do not trust you enough yet.');
    }
    case 'access': {
      if (hasAccess(r, p) && p !== r) return no('You already have passage.');
      let need = 10 - P.diplo * 8;
      if (pw > 2 && !hasTreaty(r, p, 'nap')) need = 15;
      return op >= need ? yes() : no('We will not let your troops cross our land.');
    }
    case 'alliance': {
      if (allied(r, p)) return no('We are already allies.');
      const seasoned = G.treaties.some(t => (t.type === 'nap' || t.type === 'trade' || t.type === 'access') && ((t.a === r && t.b === p) || (t.a === p && t.b === r)) && G.t - t.t0 > 90);
      if (!seasoned) return no('Alliances are built on trust. Hold a pact or trade deal with us for a while first.');
      if (alliesOf(r).length >= 3) return no('We have enough alliances.');
      if (G.nations[p].infamy > 40) return no('Your word is not worth much.');
      for (const e of enemiesOf(r)) if (allied(p, e)) return no('You are allied with our enemy.');
      for (const al of alliesOf(r)) if (atWar(al, p)) return no('You are at war with our ally.');
      return op >= 48 - P.diplo * 10 ? yes('Together, then.') : no('We are not close enough for that.');
    }
    case 'trade': {
      if (hasTreaty(r, p, 'trade')) return no('We already trade.');
      return op >= -4 - P.diplo * 3 ? yes() : no('Not interested in trading with you.');
    }
    case 'callarms': {
      const t = extra;
      if (!allied(r, p) && op < 35) return no('We are not obliged to fight your wars.');
      if (allied(r, t)) return no('We are allied with them.');
      if (truceLeft(r, t) > 0) return no('We have a truce with them.');
      if (op < 20) return no('You ask too much of us.');
      if (D.power[t] > D.power[r] * 2.2 * P.aggr) return no('That enemy is too strong for us.');
      return yes('We will stand with you.');
    }
    case 'tribute': {
      const fear = pw * (borders(r, p) ? 1 : 0.6);
      return fear * P.caution > 1.7 ? yes('Take it. Do not ask again soon.') : no('Come and take it.');
    }
  }
  return no('No.');
}
function applyAgreement(kind, a, b, extra) {
  const A = G.nations[a], B = G.nations[b];
  if (kind === 'ceasefire') { makePeace(a, b); return; }
  if (kind === 'nap') { addTreaty('nap', a, b, 360); log(`${A.short} and ${B.short} signed a non-aggression pact`, 'treaty', { nats: [a, b] }); }
  if (kind === 'access') { addTreaty('access', a, b, 360); log(`${A.short} and ${B.short} agreed passage rights`, 'treaty', { nats: [a, b] }); }
  if (kind === 'alliance') {
    removeTreaties(a, b, ['nap', 'access']);
    addTreaty('alliance', a, b, 0);
    log(`${A.short} and ${B.short} formed an alliance`, 'treaty', { nats: [a, b] });
  }
  if (kind === 'trade') { addTreaty('trade', a, b, 0); log(`${A.short} and ${B.short} opened a trade pact`, 'treaty', { nats: [a, b] }); }
  if (kind === 'callarms') { declareWar(b, extra, 'called'); return; }
  remember(a, b, 'Signed an agreement', 6, 300, 24); remember(b, a, 'Signed an agreement', 6, 300, 24);
}
function propose(from, to, kind, text, data, ttl) {
  if (G.proposals.some(p => p.from === from && p.kind === kind && p.to === to)) return;
  if (G.proposals.length >= 5) return;
  G.proposals.push({ id: G.nextProp++, from, to, kind, text, data: data || {}, t0: G.t, exp: G.t + (ttl || 50) });
  G.seq++;
  G.log.push({ s: G.seq, t: G.t, txt: `${G.nations[from].short}: ${text}`, kind: 'proposal', pid: null, me: true });
}
function answerProposal(id, yes) {
  const i = G.proposals.findIndex(p => p.id === id);
  if (i < 0) return { ok: false, msg: 'Offer expired' };
  const pr = G.proposals[i]; G.proposals.splice(i, 1);
  const me = pr.to;
  if (!yes) { remember(pr.from, me, 'Turned down our offer', -3, 200, 15); return { ok: true, msg: 'Declined' }; }
  if (pr.kind === 'tribute') {
    const n = G.nations[me], amt = Math.min(n.cash, pr.data.amount);
    n.cash -= amt; G.nations[pr.from].cash += amt;
    remember(pr.from, me, 'Paid tribute', 4, 300, 20);
    return { ok: true, msg: `Paid ${Math.round(amt)} cash` };
  }
  if (pr.kind === 'joinwar') { return declareWar(me, pr.data.target, 'ally'); }
  if (pr.kind === 'ceasefire' && !atWar(me, pr.from)) return { ok: false, msg: 'No longer at war' };
  applyAgreement(pr.kind, pr.from, me, pr.data.target);
  return { ok: true, msg: 'Agreed' };
}

// player-facing diplomacy entry point
function diplo(action, from, to, extra) {
  const A = G.nations[from], B = G.nations[to];
  if (!B.alive) return { ok: false, msg: 'Nation no longer exists' };
  if (action === 'war') return declareWar(from, to);
  if (action === 'gift') {
    const amt = extra || 100;
    if (A.cash < amt) return { ok: false, msg: 'Not enough cash' };
    A.cash -= amt; B.cash += amt;
    remember(to, from, 'Gift received', Math.min(30, amt / 6), 240, 40);
    return { ok: true, msg: `${B.short} appreciates the gift` };
  }
  if (action === 'tribute') {
    const r = evalProposal('tribute', to, from);
    const amt = Math.round(Math.max(60, B.cash * 0.3));
    if (r.ok && !B.player) {
      const take = Math.min(B.cash, amt); B.cash -= take; A.cash += take;
      remember(to, from, 'Extorted us', -25, 600, 50);
      return { ok: true, msg: `${B.short} pays ${Math.round(take)} cash under protest` };
    }
    remember(to, from, 'Threatened us', -15, 400, 40);
    return { ok: false, msg: r.msg };
  }
  if (action === 'break') {
    const t = extra;
    if (!hasTreaty(from, to, t)) return { ok: false, msg: 'No such treaty' };
    removeTreaties(from, to, [t]);
    remember(to, from, 'Cancelled our agreement', -8, 300, 30);
    enforceBorders();
    return { ok: true, msg: 'Treaty cancelled' };
  }
  const r = evalProposal(action, to, from, extra);
  if (!r.ok) {
    if (action !== 'ceasefire') remember(to, from, 'Pestering us', -1, 120, 6);
    return r;
  }
  applyAgreement(action, from, to, extra);
  return r;
}

// ---------------------------------------------------------------- AI : economy
function enemyComp(ids) {
  const c = { inf: 0, art: 0, arm: 0, air: 0 }; let tot = 0;
  for (const id of ids) for (const a of D.armiesBy[id]) for (const t of UT) { c[t] += a.u[t]; tot += a.u[t]; }
  for (const t of UT) c[t] = tot ? c[t] / tot : 0.25;
  return c;
}
function threatScore(nid, pid) {
  const p = G.provs[pid]; let s = 0;
  for (const q of PS[pid].nbrs) {
    const o = G.provs[q].owner;
    if (o === nid) continue;
    if (atWar(nid, o)) s += 3;
    else if (allied(nid, o)) s += 0;
    else s += opinion(nid, o).total < -10 ? 1.2 : 0.3;
  }
  for (const a of D.armyAt[pid] || []) if (atWar(nid, a.owner)) s += 4;
  if (G.nations[nid].capital === pid) s += 0.6;
  return s;
}
function aiEconomy(n) {
  const nid = n.id, P = pers(n), owned = D.owned[nid];
  if (!owned.length) return;
  const wars = enemiesOf(nid);
  let want = { inf: 0.42, art: 0.16, arm: 0.30, air: 0.12 };
  if (wars.length) {
    const ec = enemyComp(wars);
    if (ec.arm > 0.33) { want.air += 0.1; want.art += 0.05; want.arm -= 0.08; want.inf -= 0.07; }
    if (ec.inf > 0.55) { want.arm += 0.1; want.art += 0.05; want.inf -= 0.15; }
    if (ec.air > 0.18) { want.inf += 0.1; want.arm -= 0.05; want.air -= 0.05; }
  }
  const have = emptyU(); let tot = 0;
  for (const a of D.armiesBy[nid]) for (const t of UT) { have[t] += a.u[t]; tot += a.u[t]; }
  for (const pid of owned) for (const it of G.provs[pid].q) { have[it.type] += 1; tot += 1; }
  const reserve = wars.length ? P.reserve * 0.3 : P.reserve;
  const armyCap = 10 + owned.length * 7 + Math.max(0, n.rate.c) * 4;
  let made = 0;
  while (made < 3 && tot < armyCap) {
    if (n.rate.net < 0.25 && tot > 14 && !wars.length) break;
    const order = UT.slice().sort((a, b) => (want[b] - have[b] / Math.max(1, tot)) - (want[a] - have[a] / Math.max(1, tot)));
    let pick = null;
    for (const t of order) if (canPay(n, unitCost(t)) && n.cash - UNITS[t].c >= reserve) { pick = t; break; }
    if (!pick) break;
    // recruit near the front
    let bestP = -1, bestS = -1;
    for (const pid of owned) {
      const p = G.provs[pid];
      if (p.q.length >= 2 || p.cap) continue;
      const s = threatScore(nid, pid) + Math.random() * 0.4;
      if (s > bestS) { bestS = s; bestP = pid; }
    }
    if (bestP < 0) break;
    cmdRecruit(nid, bestP, pick);
    have[pick] += 1; tot += 1; made++;
  }
  // fortifications and infrastructure
  if (n.cash > 260 * P.econ + reserve && Math.random() < 0.6) {
    const threatened = owned.slice().sort((a, b) => threatScore(nid, b) - threatScore(nid, a));
    let did = false;
    if (wars.length || Math.random() < 0.3) {
      for (const pid of threatened.slice(0, 3)) if (G.provs[pid].fort < MAX_LVL) { if (cmdBuild(nid, pid, 'fort').ok) { did = true; break; } }
    }
    if (!did) {
      const rich = owned.filter(pid => G.provs[pid].infra < MAX_LVL).sort((a, b) => PS[b].cash + PS[b].steel + PS[b].fuel - PS[a].cash - PS[a].steel - PS[a].fuel);
      for (const pid of rich.slice(0, 2)) if (cmdBuild(nid, pid, 'infra').ok) break;
    }
  }
}

// ---------------------------------------------------------------- AI : military
function mergeIdle(nid) {
  const groups = {};
  for (const a of G.armies) if (a.owner === nid && a.at != null && !a.mv && !a.route.length) (groups[a.at] = groups[a.at] || []).push(a);
  for (const pid in groups) {
    const g = groups[pid];
    if (g.length < 2) continue;
    g.sort((x, y) => unitPow(y.u) - unitPow(x.u));
    for (let i = 1; i < g.length; i++) { for (const t of UT) g[0].u[t] += g[i].u[t]; }

    if (!c.alive || c.id === nid || atWar(nid, c.id) || allied(nid, c.id) || truceLeft(nid, c.id) > 0) continue;

// ------------------------------------------------------------ view / pan / zoom
function fitView() {
  UI.fit = Math.min(UI.W / MAP.w, UI.H / MAP.h) * 0.97;
  UI.view = { cx: MAP.w / 2, cy: MAP.h / 2, scale: UI.fit };
  applyView();
}
function applyView() {
  const v = UI.view;
  v.scale = clamp(v.scale, UI.fit * 0.85, UI.fit * 10);
  v.cx = clamp(v.cx, -80, MAP.w + 80); v.cy = clamp(v.cy, -60, MAP.h + 60);
  const w = UI.W / v.scale, h = UI.H / v.scale;
  svg.setAttribute('viewBox', `${(v.cx - w / 2).toFixed(2)} ${(v.cy - h / 2).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)}`);
  if (!labEls.length) return;
  const z = v.scale / UI.fit;
  UI.bk = (1 / v.scale) * clamp(1 + 0.14 * Math.log2(z), 0.92, 1.5);
  const fs = (9.5 / v.scale).toFixed(2);
  MAP.provinces.forEach(p => {
    const t = labEls[p.id];
    t.setAttribute('font-size', fs);
    t.setAttribute('y', (p.cy - 4 / v.scale).toFixed(2));
    t.style.display = (p.area < 1200 && z < 2.6) ? 'none' : '';
    t.setAttribute('stroke-width', (1.5 / v.scale).toFixed(2));
  });
}
function zoomAt(cx, cy, f) {
  const r = svg.getBoundingClientRect(), v = UI.view;
  const x = cx - r.left, y = cy - r.top;
  const mx = v.cx - UI.W / (2 * v.scale) + x / v.scale, my = v.cy - UI.H / (2 * v.scale) + y / v.scale;
  v.scale = clamp(v.scale * f, UI.fit * 0.85, UI.fit * 10);
  v.cx = mx - (x - UI.W / 2) / v.scale; v.cy = my - (y - UI.H / 2) / v.scale;
  applyView();
}
function focusOn(pid, zoom) {
  const d = PS[pid];
  UI.view.cx = d.cx; UI.view.cy = d.cy;
  if (zoom) UI.view.scale = Math.max(UI.view.scale, UI.fit * zoom);
  applyView();
}
function focusNation(id) {
  const ids = S.D.owned[id];
  if (!ids || !ids.length) return fitView();
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const p of ids) { const d = PS[p]; x0 = Math.min(x0, d.cx); x1 = Math.max(x1, d.cx); y0 = Math.min(y0, d.cy); y1 = Math.max(y1, d.cy); }
  UI.view.cx = (x0 + x1) / 2; UI.view.cy = (y0 + y1) / 2;
  UI.view.scale = clamp(Math.min(UI.W / (x1 - x0 + 170), UI.H / (y1 - y0 + 150)), UI.fit, UI.fit * 4);
  applyView();
}

const stage = $('#stage');
$('#sheet').addEventListener('pointerdown', () => { UI.touch = performance.now(); });
const pts = new Map();
let gesture = null, pinch = null;
stage.addEventListener('pointerdown', e => {
  if (e.target.closest('.mapctl')) return;

  try { stage.setPointerCapture(e.pointerId); } catch (_) {}
  if (pts.size === 1) gesture = { moved: false, t: performance.now(), target: e.target, x: e.clientX, y: e.clientY };
  if (pts.size === 2) {
    if (gesture) gesture.moved = true;
    const [a, b] = [...pts.values()];

    UI.view.cx -= (cx - pinch.cx) / UI.view.scale; UI.view.cy -= (cy - pinch.cy) / UI.view.scale;

// ------------------------------------------------------------ selection and orders
function handleTap(t) {

      if (ar.owner === me()) { selectArmy(ar.id); return; }

  }

// ------------------------------------------------------------ map drawing (per frame)
function makeBadge(a) {
  const n = nat(a.owner);
  const g = mk('g', { class: 'bdg', 'data-a': a.id }, L.armies);

}
function drawMap(now) {

    const c = g.nations[p.owner].color;
    if (fillCache[p.id] !== c) { provEls[p.id].style.fill = c; fillCache[p.id] = c; }
  }
  MAP.borders.forEach((b, i) => {
    const diff = g.provs[b.a].owner !== g.provs[b.b].owner;
    if (bdCache[i] !== diff) { bdEls[i].setAttribute('class', diff ? 'bd nat' : 'bd'); bdCache[i] = diff; }
  });

  while (L.capDots.length < caps.length) L.capDots.push(mk('circle', { class: 'capdot' }, L.labels));
  L.capDots.forEach((c, i) => {
    if (i >= caps.length) { c.style.display = 'none'; return; }
    c.style.display = '';
    const d = PS[caps[i]];
    c.setAttribute('cx', (d.cx - 11 * bk).toFixed(2)); c.setAttribute('cy', (d.cy - 4.5 * bk).toFixed(2)); c.setAttribute('r', (3 * bk).toFixed(2));
    c.setAttribute('stroke-width', (1.4 * bk).toFixed(2));

  L.selOut.setAttribute('stroke-width', (2.4 * Math.min(1.6, bk * UI.view.scale) / UI.view.scale).toFixed(2));

  // armies
  const groups = {};
  for (const a of g.armies) if (a.at != null) (groups[a.at] = groups[a.at] || []).push(a);
  const live = new Set();
  for (const a of g.armies) {
    live.add(a.id);
    let e = badges.get(a.id);
    if (!e) { e = makeBadge(a); badges.set(a.id, e); }

      const row = Math.floor(i / per), col = i % per, inRow = Math.min(per, n - row * per);

    if (e.last !== txt) { e.t.textContent = txt; e.last = txt; }
    const cls = 'bdg' + (a.id === UI.selA ? ' sel' : '') + (a.owner !== me() ? ' foe' : '');
    if (e.g.getAttribute('class') !== cls) e.g.setAttribute('class', cls);

  }

  // battles, sieges

    if (p.battle) {
      mk('circle', { cx: d.cx, cy: d.cy + 2 * bk, r: (13 * pulse * bk).toFixed(2), class: 'fxr', stroke: 'var(--warn)', 'stroke-width': (2 * bk).toFixed(2) }, L.fx);
      const s = 5 * bk, cx = d.cx, cy = d.cy + 2 * bk;
      mk('path', { d: `M${cx - s} ${cy - s}L${cx + s} ${cy + s}M${cx + s} ${cy - s}L${cx - s} ${cy + s}`, class: 'fxr', stroke: 'var(--warn)', 'stroke-width': (2 * bk).toFixed(2) }, L.fx);

    }

  }
}

function intelPanel() {

// ------------------------------------------------------------ modals
function modal(html) { const m = $('#modal'); m.innerHTML = `<div class="mwrap">${html}</div>`; m.hidden = false; UI.modal = true; m.scrollTop = 0; }
function closeModal() { $('#modal').hidden = true; UI.modal = false; }
let startDiff = 'normal';
function showStart() {
  let saved = null;
  try { const s = localStorage.getItem(SAVE_KEY); if (s) { const o = JSON.parse(s); saved = { day: Math.floor(o.t / 2) + 1, who: o.opts.player >= 0 ? o.nations[o.opts.player].short : 'Observer' }; } } catch (_) {}
  let cards = '';
  S.NATIONS.forEach((def, i) => {
    const pop = def.states.reduce((s, ab) => s + PS.find(p => p.abbr === ab).pop, 0);
    const inc = def.states.reduce((s, ab) => { const p = PS.find(q => q.abbr === ab); return s + p.cash; }, 0);
    cards += `<button class="nc" data-act="pick" data-v="${i}"><div class="strip" style="background:${def.color}"></div><div class="in"><b>${def.name}</b><span>${def.states.length} states &middot; capital ${def.cap}</span><div class="st">${Math.round(pop)}M people &middot; $${inc.toFixed(1)}/s</div></div></button>`;
  });
  modal(`<div class="title">Frontline<br>USA</div>
  <p class="lede">Real-time grand strategy on the American map. Ten rival powers, one continent. No premium currency, no timers to buy out, no forced ending.</p>

  <h4>AI difficulty</h4>
  <div class="opts"><div class="seg" role="group" aria-label="AI difficulty">${['easy', 'normal', 'hard'].map(d => `<button data-act="diff" data-v="${d}" aria-pressed="${d === startDiff}">${d[0].toUpperCase() + d.slice(1)}</button>`).join('')}</div></div>
  <h4>Choose your nation</h4>

  <div class="btns"><button class="btn" data-act="pick" data-v="-1">Watch the AI play</button></div>`);

function startNew(i) {
  S.newGame({ player: i, diff: startDiff });
  afterStart();
}
function afterStart() {

  fillCache.length = 0; bdCache.length = 0;
  UI.selA = null; UI.dipOpen = null; UI.dipMsg = ''; UI.confirm = ''; UI.lastSeq = G().seq; UI.started = true; UI.speed = 1;

function saveNow(quiet) {

  catch (_) { if (!quiet) toast('Could not save in this browser', 'bad'); }
}

// ------------------------------------------------------------ actions (delegated clicks)
function setSpeed(v) {
  UI.speed = v;
  document.querySelectorAll('.speed button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.v === v)));
}
function doDip(action, to, x) {
  const r = S.diplo(action, me(), to, x);
  UI.dipMsg = r.msg;
  if (action === 'war' && r.ok) { UI.dipMsg = r.msg; }
  UI.confirm = '';
  toast(r.msg, r.ok ? 'ok' : 'bad');
  dirty();
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, d = t.dataset;
  const m = G() ? me() : -1;
  switch (act) {
    case 'speed': setSpeed(+d.v); break;
    case 'tab': if (d.v === UI.tab) $('#side').classList.toggle('collapsed'); else { $('#side').classList.remove('collapsed'); setTab(d.v); } break;
    case 'zoom': { const r = svg.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, +d.v); break; }
    case 'fit': fitView(); break;
    case 'pick': startNew(+d.v); break;
    case 'diff': startDiff = d.v; document.querySelectorAll('[data-act="diff"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === startDiff))); break;
    case 'continue': if (!loadSaved()) toast('No save found', 'bad'); break;
    case 'recruit': { const r = S.cmdRecruit(m, +d.p, d.t); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'build': { const r = S.cmdBuild(m, +d.p, d.k); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'selarmy': selectArmy(+d.a); break;
    case 'selprov': selectProv(+d.p); break;
    case 'stop': S.cmdStop(+d.a); toast('Halting at the next stop', 'ok'); dirty(); break;
    case 'split': { const r = S.cmdSplit(+d.a, d.k); toast(r.msg, r.ok ? 'ok' : 'bad'); if (r.ok) { UI.selA = r.id; } dirty(); break; }
    case 'merge': { const r = S.cmdMerge(m, +d.p); toast(r.msg, r.ok ? 'ok' : 'bad'); if (r.ok) UI.selA = r.id; dirty(); break; }
    case 'disband': S.cmdDisband(+d.a); UI.selA = null; toast('Army disbanded', 'ok'); dirty(); break;
    case 'homefocus': { const c = nat(m).capital; selectProv(c); focusOn(c, 1.8); break; }
    case 'focusnat': focusNation(+d.n); break;
    case 'dipopen': {
      UI.dipOpen = UI.dipOpen === +d.n && UI.tab === 'dip' ? null : +d.n; UI.dipMsg = ''; UI.confirm = '';
      if (UI.tab !== 'dip') setTab('dip');
      dirty(); break;
    }
    case 'dip': doDip(d.v, +d.n, d.x !== undefined ? (isNaN(+d.x) ? d.x : +d.x) : undefined); break;
    case 'arm': UI.confirm = d.k; dirty(); break;
    case 'war': doDip('war', +d.n); break;
    case 'pyes': { const r = S.answerProposal(+d.id, true); toast(r.msg, r.ok ? 'ok' : 'bad'); dirty(); break; }
    case 'pno': { const r = S.answerProposal(+d.id, false); toast(r.msg, 'info'); dirty(); break; }
    case 'save': saveNow(); break;
    case 'newgame': saveNow(true); UI.started = true; showStart(); break;
    case 'keep': closeModal(); break;
    case 'watch': G().opts.player = -1; closeModal(); dirty(); break;
    case 'finish': closeModal(); setTab('intel'); break;
  }
  flush();
});
document.addEventListener('keydown', e => {
  if (!UI.started || UI.modal) return;
  if (e.key === ' ') { e.preventDefault(); setSpeed(UI.speed === 0 ? 1 : 0); }
  else if (e.key === '1') setSpeed(1); else if (e.key === '2') setSpeed(2); else if (e.key === '3') setSpeed(4);
  else if (e.key === 'Escape') { UI.selA = null; UI.selP = null; dirty(); }
  else if (e.key === 'Enter' && e.target.matches && e.target.matches('.row')) e.target.click();
});

// ------------------------------------------------------------ frame loop
let last = performance.now(), acc = 0, uiClock = 0, saveClock = 0, lastDraw = 0;
function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (UI.started && G()) {
    if (UI.speed > 0 && !UI.modal) {
      acc += dt * UI.speed;
      let n = 0;
      while (acc >= 0.25 && n < 40) { S.step(0.25); acc -= 0.25; n++; }
      if (n === 40) acc = 0;
    }
    if (now - lastDraw >= 33) { lastDraw = now; drawMap(now); }
    uiClock += dt; saveClock += dt;
    if (uiClock > 0.25) { uiClock = 0; tickUI(); }
    if (saveClock > 20) { saveClock = 0; if (!UI.modal) saveNow(true); }
  }
  requestAnimationFrame(frame);
}
function tickUI() {
  const g = G();
  renderHeader();
  for (const e of g.log) {
    if (e.s <= UI.lastSeq) continue;
    UI.lastSeq = e.s;
    if (e.me || e.kind === 'elim' || e.kind === 'revolt') toast(e.txt, e.kind);
  }
  if (g.flags.dominanceAsk && !UI.modal) {
    g.flags.dominanceAsk = false;
    modal(`<div class="title">Dominance</div><p class="lede">Your nation now holds more than 60% of the population. You can stop here and look at the standings, or keep going. The world will not let you rest: neighbours form coalitions, conquered states revolt, and rivals rebuild.</p><div class="btns"><button class="btn pri" data-act="keep">Keep playing</button><button class="btn" data-act="finish">See standings</button></div>`);
  }
  if (g.flags.playerDead && !UI.modal) {
    g.flags.playerDead = false;
    modal(`<div class="title">Fallen</div><p class="lede">${nat(g.opts.player).name} has been eliminated. You can keep watching the war play out, or start again.</p><div class="btns"><button class="btn pri" data-act="watch">Keep watching</button><button class="btn" data-act="newgame">New game</button></div>`);
  }
  if (!UI.modal) {
    if (dirtyFlag || (UI.sig !== panelSig())) { if (!pts.size && performance.now() - UI.touch > 700) { dirtyFlag = false; renderPanel(); } }
    else updateBinds();
  }
}

// ------------------------------------------------------------ boot
new ResizeObserver(() => {
  const r = stage.getBoundingClientRect();
  UI.W = r.width; UI.H = r.height;
  if (!UI.W || !UI.H) return;
  if (!UI.viewInit) { UI.viewInit = true; fitView(); if (UI.started && G() && me() >= 0) focusNation(me()); }
  else applyView();
}).observe(stage);

function boot(data) {
  data = data || {};
  buildMap();
  requestAnimationFrame(frame);
  if (data.save) { try { S.load(data.save); afterStart(); if (data.ui) { UI.speed = data.ui.speed || 1; setSpeed(UI.speed); } return; } catch (_) {} }
  showStart();
}
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ save: UI.started && G() ? S.serialize() : null, ui: { speed: UI.speed } })); } catch (_) {}
if (hot && hot.ready) hot.ready(boot); else boot((hot && hot.data) || {});
window.__flusa = { UI, S, drawMap, renderPanel };
})();
